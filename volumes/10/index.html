(function () {

  const NS = 'http://www.w3.org/2000/svg';

  const FONT = "'Humor Sans', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif";

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeInOutCubic = t => {
    t = clamp(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  const easeOutBack = (t, s = 1.70158) => {
    t = clamp(t) - 1;
    return 1 + (s + 1) * t * t * t + s * t * t;
  };

  const SCENES = [

  const AUDIO_CUES = [
    { sceneIdx: 0, localT: 0.08, type: 'intro_jingle' },
    { sceneIdx: 0, localT: 1.35, type: 'weird_yell', pitch: 620 },

    { sceneIdx: 2, localT: 0.12, type: 'future_synth' },
    { sceneIdx: 2, localT: 1.10, type: 'jet_hover' },
    { sceneIdx: 2, localT: 1.65, type: 'rage_arggh' },
    { sceneIdx: 3, localT: 0.20, type: 'mega_boom' },

    { sceneIdx: 6, localT: 0.90, type: 'weird_yell', pitch: 740 },
    { sceneIdx: 7, localT: 0.25, type: 'ash_puff' },
    { sceneIdx: 7, localT: 1.00, type: 'rage_arggh' },

    { sceneIdx: 9, localT: 0.75, type: 'weird_yell', pitch: 640 },
    { sceneIdx: 10, localT: 0.15, type: 'narrator_talk', count: 3, pitch: 210 },
    { sceneIdx: 11, localT: 0.10, type: 'narrator_talk', count: 8, pitch: 215 },

    { sceneIdx: 12, localT: 0.85, type: 'shrink_whistle' },
    { sceneIdx: 12, localT: 1.45, type: 'weird_talk', count: 5, pitch: 820 },
    { sceneIdx: 12, localT: 2.35, type: 'poop_horn' },
    { sceneIdx: 13, localT: 0.35, type: 'barf_blek' },
    { sceneIdx: 13, localT: 1.45, type: 'narrator_talk', count: 5, pitch: 215 },

  ].map((c, idx) => ({ ...c, id: idx, globalT: SCENES[c.sceneIdx].start + c.localT }));

  // --- SVG Primitives ---
  const esc = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function svgText(x, y, text, opts = {}) {
    const { size = 28, weight = '700', fill = INK, anchor = 'middle', rot = 0, opacity = 1, stroke = 'none', strokeWidth = 0, letterSpacing = 0.3 } = opts;
    if (opacity <= 0.005) return '';
    const tf = rot ? ` transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"` : '';
    const st = stroke !== 'none' ? ` stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" paint-order="stroke"` : '';
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${FONT}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${letterSpacing}" opacity="${opacity.toFixed(3)}"${st}${tf}>${esc(text)}</text>`;
  }

  function svgMultiText(x, y, lines, opts = {}) {
    const lineH = opts.lineHeight || (opts.size || 24) * 1.18;
    const startY = y - ((lines.length - 1) * lineH) / 2;
    return lines.map((line, i) => svgText(x, startY + i * lineH, line, opts)).join('');
  }

  function speechBubble(opts) {
    const { cx, cy, rx, ry, tailX, tailY, lines = [], fontSize = 22, lineHeight, fill = '#FFFFFF', stroke = INK, strokeWidth = 3.2, textColor = INK, spiky = false, scale = 1, opacity = 1, rot = 0 } = opts;
    if (opacity <= 0.005 || scale <= 0.01) return '';
    let shape = '';
    if (spiky) {
      const spikes = 16, pts = [];
      for (let i = 0; i < spikes * 2; i++) {
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const m = i % 2 === 0 ? 1.12 : 0.88;
        pts.push(`${(Math.cos(a) * rx * m).toFixed(1)},${(Math.sin(a) * ry * m).toFixed(1)}`);
      }
      let tail = '';
      if (tailX !== undefined && tailY !== undefined) {
        const dx = tailX - cx, dy = tailY - cy, ang = Math.atan2(dy, dx);
        tail = `<path d="M ${(Math.cos(ang - 0.25) * rx * 0.72).toFixed(1)} ${(Math.sin(ang - 0.25) * ry * 0.72).toFixed(1)} L ${dx.toFixed(1)} ${dy.toFixed(1)} L ${(Math.cos(ang + 0.25) * rx * 0.72).toFixed(1)} ${(Math.sin(ang + 0.25) * ry * 0.72).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      shape = `${tail}<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>`;
    } else {
      const k = 0.55228;
      const d = [
        `M 0 ${(-ry).toFixed(1)}`,
        `C ${(rx * k * 1.03).toFixed(1)} ${(-ry * 0.99).toFixed(1)}, ${(rx * 1.02).toFixed(1)} ${(-ry * k).toFixed(1)}, ${(rx * 0.99).toFixed(1)} 0`,
        `C ${(rx * 1.01).toFixed(1)} ${(ry * k * 1.02).toFixed(1)}, ${(rx * k).toFixed(1)} ${(ry * 1.02).toFixed(1)}, 0 ${(ry * 0.99).toFixed(1)}`,
        `C ${(-rx * k * 1.02).toFixed(1)} ${(ry * 1.01).toFixed(1)}, ${(-rx * 1.02).toFixed(1)} ${(ry * k).toFixed(1)}, ${(-rx * 0.99).toFixed(1)} 0`,
        `C ${(-rx * 1.01).toFixed(1)} ${(-ry * k * 1.02).toFixed(1)}, ${(-rx * k).toFixed(1)} ${(-ry * 1.02).toFixed(1)}, 0 ${(-ry).toFixed(1)} Z`
      ].join(' ');
      let tail = '', maskPatch = '';
      if (tailX !== undefined && tailY !== undefined) {
        const dx = tailX - cx, dy = tailY - cy, ang = Math.atan2(dy, dx);
        const b1x = Math.cos(ang - 0.24) * rx * 0.85, b1y = Math.sin(ang - 0.24) * ry * 0.85;
        const b2x = Math.cos(ang + 0.24) * rx * 0.85, b2y = Math.sin(ang + 0.24) * ry * 0.85;
        const midX = (b1x + b2x) * 0.35 + dx * 0.35, midY = (b1y + b2y) * 0.35 + dy * 0.35;
        tail = `<path d="M ${b1x.toFixed(1)} ${b1y.toFixed(1)} Q ${midX.toFixed(1)} ${midY.toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)} Q ${(midX + (b2x - b1x) * 0.3).toFixed(1)} ${(midY + (b2y - b1y) * 0.3).toFixed(1)} ${b2x.toFixed(1)} ${b2y.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round"/>`;
        maskPatch = `<path d="M ${(b1x * 0.95).toFixed(1)} ${(b1y * 0.95).toFixed(1)} L ${(dx * 0.78).toFixed(1)} ${(dy * 0.78).toFixed(1)} L ${(b2x * 0.95).toFixed(1)} ${(b2y * 0.95).toFixed(1)} Z" fill="${fill}" stroke="none"/>`;
      }
      shape = `${tail}<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>${maskPatch}`;
    }
    const txt = svgMultiText(0, 6, lines, { size: fontSize, lineHeight: lineHeight || fontSize * 1.15, fill: textColor });
    return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})" opacity="${opacity.toFixed(3)}">${shape}${txt}</g>`;
  }

  function handArrow(x1, y1, x2, y2, cx, cy, color = INK) {
    const ang = Math.atan2(y2 - cy, x2 - cx), len = 13;
    return `<g stroke="${color}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>
      <path d="M ${(x2 - Math.cos(ang - 0.5) * len).toFixed(1)} ${(y2 - Math.sin(ang - 0.5) * len).toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)} L ${(x2 - Math.cos(ang + 0.5) * len).toFixed(1)} ${(y2 - Math.sin(ang + 0.5) * len).toFixed(1)}"/>
    </g>`;
  }

  // Weird Guy — canonical V-shaped ANGRY EYEBROWS (no duplicate eyebrows!)
  function weirdGuy(opts = {}) {
    const {
      x = 300, y = 500, scale = 1, rot = 0,
      eyes = 'normal', mouth = 'open', arms = 'out',

    if (opacity <= 0.005) return '';
    const mouthPulse = mouth === 'yell' ? 1 + Math.sin(t * 28) * 0.09 : 1;

    const buttSvg = bigButt ? `<g transform="translate(8 36) scale(1.38)">

    const torso = `<path d="M -2 -8 C -16 -2, -16 44, 0 54 C 15 44, 15 -2, 2 -8 Z" fill="#FFF" stroke="${INK}" stroke-width="3.6" stroke-linejoin="round"/>`;

    let armSvg = `<path d="M -11 14 L -48 22 M 11 14 L 48 18" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`;
    if (comicProp) {
      armSvg = `<path d="M -11 16 L -82 2 M 11 16 L 52 -4" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>
        <g transform="translate(-112 18) rotate(-5)">

    } else if (arms === 'up') {
      armSvg = `<path d="M -11 12 L -50 -20 M 11 12 L 50 -16" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`;
    }

    const head = `<path d="M 0 -92 C 26 -93, 44 -74, 42 -48 C 43 -22, 24 -7, 0 -8 C -25 -7, -43 -23, -42 -49 C -43 -75, -24 -92, 0 -92 Z" fill="#FFF" stroke="${INK}" stroke-width="3.8" stroke-linejoin="round"/>`;
    // Iconic V-shaped angry eyebrows!
    const eyebrows = `<path d="M ${(-18 + hw * 0.4).toFixed(1)} -124 L -1 -90 L ${(19 + hw * 0.4).toFixed(1)} -126" fill="none" stroke="${INK}" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>`;

    let eyeSvg = `<path d="M -12 -75 L -11 -56 M 12 -75 L 13 -56" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`;
    if (eyes === 'angry') eyeSvg = `<path d="M -14 -76 L -12 -55 M 14 -76 L 12 -55" stroke="${INK}" stroke-width="4.2" stroke-linecap="round"/>`;
    else if (eyes === 'squint') eyeSvg = `<path d="M -22 -70 L -10 -62 L -22 -54 M 22 -70 L 10 -62 L 22 -54" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;

    const mouthSvg = mouth === 'yell'
      ? `<g transform="translate(0 -34) scale(1 ${mouthPulse.toFixed(3)})"><ellipse cx="0" cy="0" rx="14" ry="20" fill="${INK}"/><ellipse cx="0" cy="10" rx="8" ry="6" fill="#DC2626" opacity="0.85"/></g>`
      : `<ellipse cx="0" cy="-36" rx="12" ry="17" fill="${INK}"/>`;

    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})" opacity="${opacity.toFixed(3)}">
      ${buttSvg}${legSvg}${torso}${armSvg}${head}${eyebrows}${eyeSvg}${mouthSvg}
    </g>`;
  }

  // Sci-Fi Time Travel Ray Gun (Panel 1!)
  function timeRayGun({ x, y, scale = 1, zapping = false, zapLen = 135, t = 0 }) {
    const jitter = zapping ? Math.sin(t * 60) * 3 : 0;
    let zapSvg = '';
    if (zapping) {
      const segs = 5;
      let d1 = 'M -62 0', d2 = 'M -62 8';
      for (let i = 1; i <= segs; i++) {
        const px = -62 - (zapLen * i) / segs;
        const py = (i % 2 === 0 ? -18 : 18) + Math.sin(t * 45 + i * 2) * 6;
        d1 += ` L ${px.toFixed(1)} ${(py - 6).toFixed(1)}`;
        d2 += ` L ${px.toFixed(1)} ${(py + 12).toFixed(1)}`;
      }
      zapSvg = `<g>
        <path d="${d1}" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
        <path d="${d1}" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${d2}" fill="none" stroke="#A855F7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
        <circle cx="${(-62 - zapLen).toFixed(1)}" cy="4" r="${(18 + Math.sin(t * 40) * 5).toFixed(1)}" fill="#22D3EE" opacity="0.75"/>
      </g>`;
    }
    return `<g transform="translate(${(x + jitter).toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})">
      ${zapSvg}
      <rect x="-42" y="-76" width="54" height="36" rx="6" fill="#CBD5E1" stroke="${INK}" stroke-width="3.4"/>

      <ellipse cx="-52" cy="2" rx="11" ry="22" fill="${zapping ? '#22D3EE' : '#475569'}"/>
      ${svgMultiText(18, 4, ['Time', 'travel', 'ray'], { size: 20, lineHeight: 22, fill: '#0E7490' })}
    </g>`;

  // Futuristic Jet-Powered Hover Folding Chair (Panels 2 & 4!)
  function jetFoldingChair({ x, y, scale = 1, t = 0 }) {
    const fl = 0.88 + 0.22 * Math.sin(t * 32);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})">
      <!-- Twin rocket thrusters under the legs -->
      <g transform="translate(-44 65)">
        <rect x="-18" y="-12" width="36" height="28" rx="4" fill="#64748B" stroke="${INK}" stroke-width="3"/>

        <path d="M -14 20 L -8 ${(54 * fl).toFixed(1)} L 0 ${(36 * fl).toFixed(1)} L 8 ${(56 * fl).toFixed(1)} L 14 20 Z" fill="#F97316" stroke="#DC2626" stroke-width="2.4"/>
      </g>
      <g transform="translate(44 65)">
        <rect x="-18" y="-12" width="36" height="28" rx="4" fill="#64748B" stroke="${INK}" stroke-width="3"/>
        <ellipse cx="0" cy="18" rx="16" ry="7" fill="${INK}"/>
        <path d="M -14 20 L -8 ${(56 * fl).toFixed(1)} L 0 ${(36 * fl).toFixed(1)} L 8 ${(54 * fl).toFixed(1)} L 14 20 Z" fill="#F97316" stroke="#DC2626" stroke-width="2.4"/>
      </g>
      <!-- Folding X legs -->
      <g stroke="#475569" stroke-width="5" stroke-linecap="round">
        <line x1="-68" y1="0" x2="-24" y2="56"/><line x1="-20" y1="0" x2="-68" y2="56"/>
        <line x1="20" y1="0" x2="68" y2="56"/><line x1="68" y1="0" x2="24" y2="56"/>
      </g>
      <rect x="-92" y="-8" width="184" height="14" rx="6" fill="#38BDF8" stroke="${INK}" stroke-width="3.2"/>
    </g>`;
  }

  function tntBoomerang({ x, y, rot = 0, scale = 1 }) {

  function renderScene(sceneIdx, localT) {

        const bubS = easeOutBack(invLerp(1.25, 1.75, t));
        const aOp = invLerp(2.1, 2.6, t);

        out += `<circle cx="268" cy="545" r="148" fill="#CFFAFE" opacity="0.65"/>`;

      case 2: { // Panel 2: "In the future!!!" + Jet Chair + TNT Boomerang + Robo-Prankster!

        out += svgText(445, 780, 'zoom!!!', { size: 52, fill: '#0284C7', rot: -6, opacity: invLerp(0.15, 0.55, t) });
        break;

        const fS = 0.92 + 0.14 * Math.sin(t * 26);

          <path d="M -18 -124 L -1 -90 L 19 -126" fill="none" stroke="${INK}" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M -14 -76 L -12 -55 M 14 -76 L 12 -55" stroke="${INK}" stroke-width="4.2" stroke-linecap="round"/>
          <!-- Fire covering lower half of face! -->

            <path d="M -68 78 L -56 -32 L -32 16 L -14 -44 L 4 14 L 22 -42 L 42 18 L 62 -30 L 72 78 L 44 40 L 18 90 L -6 40 L -32 88 L -50 42 Z"

            <path d="M -42 54 L -32 -16 L -10 22 L 6 -28 L 24 22 L 42 -14 L 46 58 L 16 32 L -4 62 L -24 30 Z" fill="#FDE047"/>

        // Game controller sitting on the floor!
        out += `<g transform="translate(265 725)">
          <path d="M -52 -18 C -72 -18, -82 32, -56 38 C -40 42, -32 18, -20 14 L 20 14 C 32 18, 40 42, 56 38 C 82 32, 72 -18, 52 -18 Z"
                fill="#E2E8F0" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M -48 -4 L -48 16 M -58 6 L -38 6" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
          <circle cx="42" cy="-2" r="5" fill="#EF4444"/><circle cx="54" cy="8" r="5" fill="#3B82F6"/>
          <circle cx="30" cy="8" r="5" fill="#22C55E"/><circle cx="42" cy="18" r="5" fill="#FACC15"/>
        </g>`;

        out += speechBubble({
          cx: 268, cy: 172, rx: 185, ry: 88,
          tailX: 222, tailY: 355,
          lines: ["I can't play", 'Minecraft!!!'],
          fontSize: 36, scale: easeOutBack(invLerp(1.0, 1.5, t)), fill: '#FEF9C3', textColor: '#B91C1C'
        });
        break;
      }

      case 9: { // Panel 9: Big Ash pile crying "Help!!!"
        out += ashPile({ x: 285, y: 315, scale: 1.38, dark: true, t });
        out += speechBubble({
          cx: 312, cy: 625, rx: 128, ry: 88,
          tailX: 295, tailY: 448,
          lines: ['Help!!!'],
          fontSize: 54, scale: easeOutBack(invLerp(0.65, 1.15, t)), fill: '#FEE2E2', textColor: '#DC2626'
        });
        break;
      }

      case 10: { // Panel 10: "Okay!!!" + Round dark Ash ball
        out += svgText(300, 128, 'Okay!!!', { size: 74, fill: '#1D4ED8', opacity: invLerp(0.08, 0.45, t) });
        out += ashPile({ x: 300, y: 505, scale: 1.48, dark: true, t });
        break;
      }

      case 11: { // Panel 11: "poo poo poo (big butt) this is a magic spell!!!" + "poof!!!"
        out += svgMultiText(300, 148, ['poo poo poo', '(big butt)', 'this is a', 'magic spell!!!'], {
          size: 44, lineHeight: 52, fill: '#7C3AED', opacity: invLerp(0.08, 0.5, t)
        });
        out += poofCloud({ x: 300, y: 555, scale: easeOutBack(invLerp(1.05, 1.6, t)), t });
        break;
      }

      case 12: { // Panel 12: "You are tiny!!!!!!" + Tiny Weird Guy with GIANT butt!
        const sPop = easeOutBack(invLerp(0.25, 0.85, t));
        out += svgText(300, 118, 'You are tiny!!!!!!', { size: 58, fill: '#1D4ED8', opacity: invLerp(0.08, 0.45, t) });

        // Tiny Weird Guy with a giant butt in the middle!
        out += weirdGuy({ x: 295, y: 495, scale: 0.34 * sPop, arms: 'up', bigButt: true, eyes: 'angry', mouth: 'yell', t });

        out += speechBubble({
          cx: 300, cy: 312, rx: 142, ry: 82,
          tailX: 295, tailY: 442,
          lines: ['Hey!! Now', "I'm tiny!!!"],
          fontSize: 32, scale: easeOutBack(invLerp(1.3, 1.8, t)), fill: '#FEF9C3', textColor: '#B91C1C'
        });

        out += speechBubble({
          cx: 300, cy: 678, rx: 152, ry: 88,
          tailX: 295, tailY: 545,
          lines: ['My butt', 'is giant!!!'],
          fontSize: 36, scale: easeOutBack(invLerp(2.2, 2.7, t)), fill: '#FEE2E2', textColor: '#DC2626'
        });
        break;
      }

      case 13: { // Panel 13: "Barf!!!" waterfall + "Notice the big butt" arrow!
        const bf = easeOutCubic(invLerp(0.3, 1.35, t));
        if (bf > 0.02) {
          out += `<g transform="translate(305 452) scale(${bf.toFixed(3)})">
            <path d="M 0 0 C -85 -48, -165 -30, -232 45 L -248 255 L -178 195 L -145 315 L -78 215 L -48 295 L 0 65 Z"
                  fill="#A3E635" stroke="#4D7C0F" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
            <ellipse cx="-145" cy="115" rx="34" ry="62" fill="#BEF264" opacity="0.65"/>
          </g>`;
        }

        out += weirdGuy({ x: 345, y: 495, scale: 0.92, bigButt: true, eyes: 'squint', mouth: 'yell', t });

        out += speechBubble({
          cx: 205, cy: 205, rx: 122, ry: 86, rot: -12,
          tailX: 312, tailY: 405,
          lines: ['Barf!!!'],
          fontSize: 52, scale: easeOutBack(invLerp(0.35, 0.85, t)), fill: '#ECFCCB', textColor: '#3F6212'
        });

        // "Notice the big butt" caption + arrow!
        out += `<g opacity="${invLerp(1.35, 1.85, t).toFixed(2)}">
          ${svgMultiText(488, 325, ['Notice', 'the big', 'butt'], { size: 36, lineHeight: 40, fill: '#7C3AED' })}
          ${handArrow(462, 398, 412, 488, 455, 452, '#7C3AED')}
        </g>`;
        break;
      }

      case 14: { // Panel 14: "Your barf turned you into a normal human and made a barf ocean!!!" + "Noooo!!!"
        bg = '#F7FEE7';
        const tide = lerp(520, 145, easeOutCubic(invLerp(0.15, 1.4, t)));
        out += barfOcean({ levelY: tide, t });

        out += svgMultiText(300, 128, ['Your barf turned you', 'into a normal human', 'and made a barf ocean!!!'], {
          size: 36, lineHeight: 44, fill: '#3F6212', stroke: '#F7FEE7', strokeWidth: 7,
          opacity: invLerp(0.08, 0.48, t)
        });

        out += weirdGuy({ x: 225, y: 555, scale: 1.15, arms: 'up', bigButt: true, eyes: 'angry', mouth: 'yell', t });

        out += speechBubble({
          cx: 452, cy: 438, rx: 118, ry: 72,
          tailX: 295, tailY: 495,
          lines: ['Noooo!!!'],
          fontSize: 40, scale: easeOutBack(invLerp(1.4, 1.9, t)), fill: '#FFFFFF', textColor: '#DC2626'
        });
        break;
      }

      case 15: { // Panel 15: "The End" + Floating sideways in Barf Ocean + "I'm going to drown!!!"
        bg = '#F7FEE7';
        const floatY = 535 + Math.sin(t * 3.8) * 14;
        out += barfOcean({ levelY: 96, t });

        const endS = easeOutBack(invLerp(0.45, 1.05, t));
        out += `<g transform="translate(300 285) scale(${endS.toFixed(3)})">
          ${svgText(0, 16, 'The End', { size: 92, fill: INK, stroke: '#F7FEE7', strokeWidth: 7 })}
          <path d="M -165 44 Q 0 32 165 44" fill="none" stroke="#65A30D" stroke-width="5.5" stroke-linecap="round"/>
        </g>`;

        // Floating sideways in the barf ocean (giant butt sticking right up!)
        out += weirdGuy({ x: 295, y: floatY, scale: 1.08, rot: -90, bigButt: true, eyes: 'squint', mouth: 'yell', t });

        // Rising barf bubbles
        const bY = (t * 48) % 90;
        out += `<g fill="#ECFCCB" fill-opacity="0.8" stroke="#4D7C0F" stroke-width="2.2">
          <circle cx="155" cy="${(485 - bY).toFixed(1)}" r="10"/>
          <circle cx="465" cy="${(455 - bY).toFixed(1)}" r="12"/>
        </g>`;

        out += speechBubble({
          cx: 295, cy: 718, rx: 158, ry: 74,
          tailX: 245, tailY: floatY + 42,
          lines: ["I'm going to", 'drown!!!'],
          fontSize: 32, scale: easeOutBack(invLerp(1.9, 2.4, t)), fill: '#FFFFFF', textColor: '#B91C1C'
        });

        out += svgText(300, 814, 'The Weird Guy #10  •  By superbear1859', {
          size: 18, fill: '#365314', opacity: invLerp(2.9, 3.5, t) * 0.9
        });
        break;
      }
    }

    return wrapPanel(out, { panelNum: s.panelNum, shakeX, shakeY, bg });
  }

  function timeToScene(globalT) {
    const t = clamp(globalT, 0, TOTAL_DURATION);
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].end || i === SCENES.length - 1) return { sceneIdx: i, localT: t - SCENES[i].start };
    }
    return { sceneIdx: 0, localT: 0 };
  }

  // =========================================================================
  // REAL-TIME WEB AUDIO CARTOON SFX & CHATTER SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.16, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playSweep(f0, f1, dur, type = 'triangle', vol = 0.18, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f0), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, vol = 0.16, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = filterType; flt.frequency.setValueAtTime(filterFreq, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  function triggerCue(cue) {
    if (muted || !audioCtx) return;
    const tp = cue.type;
    if (tp === 'intro_jingle') {
      [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.18, i * 0.10));
    } else if (tp === 'outro_jingle') {
      [[523, 0.16, 0], [494, 0.16, 0.15], [466, 0.16, 0.30], [440, 0.42, 0.45]].forEach(([f, d, dl]) => playTone(f, d, 'triangle', 0.18, dl));
    } else if (tp === 'weird_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 560;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 150 - 55), 0.065, 'square', 0.08, i * 0.085);
    } else if (tp === 'narrator_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 205;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 45 - 20), 0.10, 'sawtooth', 0.10, i * 0.115);
    } else if (tp === 'weird_yell') {
      const b = cue.pitch || 650;
      playSweep(b * 0.85, b * 1.25, 0.28, 'square', 0.12);
    } else if (tp === 'time_zap') {
      for (let i = 0; i < 6; i++) playSweep(420 + i * 160, 1400 - i * 120, 0.09, 'sawtooth', 0.14, i * 0.08);
      playSweep(1600, 260, 0.45, 'sine', 0.18, 0.42);
    } else if (tp === 'future_synth') {
      [440, 554, 659, 880, 1108].forEach((f, i) => playTone(f, 0.18, 'sine', 0.15, i * 0.08));
    } else if (tp === 'jet_hover') {
      playNoise(0.75, 0.14, 900, 'bandpass');
    } else if (tp === 'jet_zoom') {
      playSweep(320, 1450, 0.35, 'sawtooth', 0.14);
      playNoise(0.35, 0.18, 1600, 'bandpass');
    } else if (tp === 'mega_boom') {
      playSweep(150, 32, 0.72, 'sine', 0.32);
      playNoise(0.75, 0.28, 420, 'lowpass');
    } else if (tp === 'fire_roar') {
      playNoise(0.95, 0.22, 650, 'bandpass');
      playNoise(0.90, 0.15, 2200, 'highpass', 0.08);
    } else if (tp === 'muffled_mmmfff') {
      for (let i = 0; i < 5; i++) playTone(210 + (i % 2) * 45, 0.09, 'triangle', 0.14, i * 0.10);
    } else if (tp === 'ash_puff') {
      playNoise(0.45, 0.18, 2200, 'bandpass');
      playSweep(420, 180, 0.30, 'sine', 0.10);
    } else if (tp === 'game_blip') {
      [523, 659, 784, 523].forEach((f, i) => playTone(f, 0.08, 'square', 0.09, i * 0.09));
    } else if (tp === 'magic_poof') {
      playNoise(0.32, 0.22, 1600, 'bandpass');
      [660, 880, 1175, 1568].forEach((f, i) => playTone(f, 0.16, 'sine', 0.14, i * 0.06));
    } else if (tp === 'shrink_whistle') {
      playSweep(320, 1650, 0.50, 'sine', 0.18);
    } else if (tp === 'poop_horn') {
      playSweep(190, 92, 0.42, 'sawtooth', 0.20);
      playSweep(140, 68, 0.38, 'square', 0.11, 0.04);
    } else if (tp === 'barf_blek') {
      playSweep(280, 95, 0.52, 'sawtooth', 0.20);
      playNoise(0.48, 0.20, 750, 'bandpass');
    } else if (tp === 'ocean_wave') {
      playNoise(0.95, 0.20, 520, 'lowpass');
    } else if (tp === 'underwater_bubbles') {
      for (let i = 0; i < 6; i++) playSweep(280 + i * 70, 720 + i * 85, 0.09, 'sine', 0.13, i * 0.11);
    } else if (tp === 'evil_laugh') {
      [310, 290, 275, 320, 285, 260, 240, 220].forEach((f, i) => playTone(f, 0.085, 'sawtooth', 0.12, i * 0.105));
    } else if (tp === 'rage_arggh') {
      playSweep(460, 720, 0.45, 'sawtooth', 0.15);
    }
  }

  // =========================================================================
  // PLAYER STATE & UI
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const sceneBadge = document.getElementById('sceneBadge');
  const timeReadout = document.getElementById('timeReadout');
  const scrubber = document.getElementById('scrubber');
  const playOverlay = document.getElementById('playOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnMute = document.getElementById('btnMute');
  const speedSelect = document.getElementById('speedSelect');
  const sceneGrid = document.getElementById('sceneGrid');

  let currentTime = 0, playing = false, speed = 1.0, lastFrameTs = null;
  let firedCues = new Set(), activeSceneIdx = -1, hasInteracted = false;

  SCENES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-pill';
    btn.dataset.idx = i;
    btn.textContent = s.panelNum === null ? 'Cover' : `${s.panelNum}. ${s.title}`;
    btn.title = s.panelNum === null ? 'Cover' : `Panel ${s.panelNum}: ${s.title}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      seekTo(s.start + 0.01);
      setPlaying(true);
    });
    sceneGrid.appendChild(btn);
  });

  const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function updateUI() {
    const { sceneIdx, localT } = timeToScene(currentTime);
    const s = SCENES[sceneIdx];
    stageEl.innerHTML = renderScene(sceneIdx, localT);
    sceneBadge.textContent = `${s.panelNum === null ? 'Cover' : 'Panel ' + s.panelNum} • ${sceneIdx + 1} / ${SCENES.length}`;
    timeReadout.textContent = `${fmtTime(currentTime)} / ${fmtTime(TOTAL_DURATION)}`;
    scrubber.value = Math.round((currentTime / TOTAL_DURATION) * 1000);
    if (sceneIdx !== activeSceneIdx) {
      activeSceneIdx = sceneIdx;
      for (const el of sceneGrid.children) {
        const isCur = Number(el.dataset.idx) === sceneIdx;
        el.className = isCur ? 'scene-pill active' : 'scene-pill';
      }
      if (hasInteracted && window.WeirdGuyProgress) {
        window.WeirdGuyProgress.save('10', sceneIdx, SCENES.length, currentTime >= TOTAL_DURATION - 0.1);
      }
    }
  }

  function seekTo(t) {
    hasInteracted = true;
    currentTime = clamp(t, 0, TOTAL_DURATION);
    firedCues = new Set();
    for (const c of AUDIO_CUES) if (c.globalT < currentTime - 0.05) firedCues.add(c.id);
    updateUI();
  }

  function setPlaying(val) {
    playing = val;
    playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    playLabel.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      hasInteracted = true;
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      if (currentTime >= TOTAL_DURATION - 0.05) seekTo(0);
      lastFrameTs = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.08, (now - lastFrameTs) / 1000) * speed;
    lastFrameTs = now;
    currentTime = Math.min(TOTAL_DURATION, currentTime + dt);
    for (const c of AUDIO_CUES) {
      if (!firedCues.has(c.id) && c.globalT <= currentTime) {
        firedCues.add(c.id);
        triggerCue(c);
      }
    }
    updateUI();
    if (currentTime >= TOTAL_DURATION) {
      if (window.WeirdGuyProgress) window.WeirdGuyProgress.save('10', SCENES.length - 1, SCENES.length, true);
      setPlaying(false);
    }
    else requestAnimationFrame(tick);
  }

  btnPlay.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('stageContainer').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('overlayPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); setPlaying(true); });
  btnRestart.addEventListener('click', () => { seekTo(0); setPlaying(true); });
  btnPrev.addEventListener('click', () => seekTo(SCENES[Math.max(0, activeSceneIdx - 1)].start + 0.01));
  btnNext.addEventListener('click', () => seekTo(SCENES[Math.min(SCENES.length - 1, activeSceneIdx + 1)].start + 0.01));
  scrubber.addEventListener('input', () => seekTo((Number(scrubber.value) / 1000) * TOTAL_DURATION));
  speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value) || 1; });
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.innerHTML = muted ? '&#128263; Muted' : '&#128266; Sound On';
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'm' || e.key === 'M') { btnMute.click(); }
  });

  window.WeirdGuyVolume = {
    id: '10',
    number: 10,
    title: "Let's Time Travel!!!",
    edition: 'Blank Edition!!!',
    author: 'superbear1859',
    scenes: SCENES,
    renderScene: renderScene
  };

  const initialScene = window.WeirdGuyProgress ? window.WeirdGuyProgress.getInitialSceneFromHash(SCENES.length) : null;
  if (initialScene !== null && initialScene > 0) {
    currentTime = SCENES[initialScene].start + 0.01;
    updateUI();
  } else {
    currentTime = 3.2;
    updateUI();
    currentTime = 0;
    scrubber.value = 0;
    timeReadout.textContent = `0:00 / ${fmtTime(TOTAL_DURATION)}`;
  }
})();
