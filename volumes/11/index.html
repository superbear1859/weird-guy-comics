  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeInOutCubic = t => {
    t = clamp(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  const easeOutBack = (t, s = 1.70158) => {
    t = clamp(t) - 1;

  const easeOutBounce = t => {

  // --- SVG Primitives ---
  const esc = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function svgText(x, y, text, opts = {}) {
    const { size = 28, weight = '700', fill = INK, anchor = 'middle', rot = 0, opacity = 1, stroke = 'none', strokeWidth = 0, letterSpacing = 0.3 } = opts;
    if (opacity <= 0.005) return '';
    const tf = rot ? ` transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"` : '';
    const st = stroke !== 'none' ? ` stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" paint-order="stroke"` : '';
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${FONT}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${letterSpacing}" opacity="${opacity.toFixed(3)}"${st}${tf}>${esc(text)}</text>`;
  }

  function svgMultiText(x, y, lines, opts = {}) {
    const lineH = opts.lineHeight || (opts.size || 24) * 1.18;
    const startY = y - ((lines.length - 1) * lineH) / 2;
    return lines.map((line, i) => svgText(x, startY + i * lineH, line, opts)).join('');
  }

  function speechBubble(opts) {
    const { cx, cy, rx, ry, tailX, tailY, tail2X, tail2Y, lines = [], fontSize = 22, lineHeight, fill = '#FFFFFF', stroke = INK, strokeWidth = 3.2, textColor = INK, spiky = false, scale = 1, opacity = 1, rot = 0 } = opts;
    if (opacity <= 0.005 || scale <= 0.01) return '';
    const makeTail = (tx, ty) => {
      if (tx === undefined || ty === undefined) return { tail: '', mask: '' };
      const dx = tx - cx, dy = ty - cy, ang = Math.atan2(dy, dx);
      const b1x = Math.cos(ang - 0.22) * rx * 0.84, b1y = Math.sin(ang - 0.22) * ry * 0.84;
      const b2x = Math.cos(ang + 0.22) * rx * 0.84, b2y = Math.sin(ang + 0.22) * ry * 0.84;
      const midX = (b1x + b2x) * 0.35 + dx * 0.35, midY = (b1y + b2y) * 0.35 + dy * 0.35;
      return {
        tail: `<path d="M ${b1x.toFixed(1)} ${b1y.toFixed(1)} Q ${midX.toFixed(1)} ${midY.toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)} Q ${(midX + (b2x - b1x) * 0.3).toFixed(1)} ${(midY + (b2y - b1y) * 0.3).toFixed(1)} ${b2x.toFixed(1)} ${b2y.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round"/>`,
        mask: `<path d="M ${(b1x * 0.94).toFixed(1)} ${(b1y * 0.94).toFixed(1)} L ${(dx * 0.78).toFixed(1)} ${(dy * 0.78).toFixed(1)} L ${(b2x * 0.94).toFixed(1)} ${(b2y * 0.94).toFixed(1)} Z" fill="${fill}" stroke="none"/>`
      };
    };
    const t1 = makeTail(tailX, tailY);
    const t2 = makeTail(tail2X, tail2Y);
    let shape = '';
    if (spiky) {
      const spikes = 16, pts = [];
      for (let i = 0; i < spikes * 2; i++) {
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const m = i % 2 === 0 ? 1.12 : 0.88;
        pts.push(`${(Math.cos(a) * rx * m).toFixed(1)},${(Math.sin(a) * ry * m).toFixed(1)}`);
      }
      shape = `${t1.tail}${t2.tail}<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>`;
    } else {
      const k = 0.55228;
      const d = [
        `M 0 ${(-ry).toFixed(1)}`,
        `C ${(rx * k * 1.03).toFixed(1)} ${(-ry * 0.99).toFixed(1)}, ${(rx * 1.02).toFixed(1)} ${(-ry * k).toFixed(1)}, ${(rx * 0.99).toFixed(1)} 0`,
        `C ${(rx * 1.01).toFixed(1)} ${(ry * k * 1.02).toFixed(1)}, ${(rx * k).toFixed(1)} ${(ry * 1.02).toFixed(1)}, 0 ${(ry * 0.99).toFixed(1)}`,
        `C ${(-rx * k * 1.02).toFixed(1)} ${(ry * 1.01).toFixed(1)}, ${(-rx * 1.02).toFixed(1)} ${(ry * k).toFixed(1)}, ${(-rx * 0.99).toFixed(1)} 0`,
        `C ${(-rx * 1.01).toFixed(1)} ${(-ry * k * 1.02).toFixed(1)}, ${(-rx * k).toFixed(1)} ${(-ry * 1.02).toFixed(1)}, 0 ${(-ry).toFixed(1)} Z`
      ].join(' ');
      shape = `${t1.tail}${t2.tail}<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>${t1.mask}${t2.mask}`;
    }
    const txt = svgMultiText(0, 6, lines, { size: fontSize, lineHeight: lineHeight || fontSize * 1.15, fill: textColor });
    return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})" opacity="${opacity.toFixed(3)}">${shape}${txt}</g>`;
  }

  function handArrow(x1, y1, x2, y2, cx, cy, color = INK) {

        out += speechBubble({
          cx: 300, cy: 752, rx: 245, ry: 52,
          tailX: 122, tailY: 662, tail2X: 468, tail2Y: 662,
          lines: ['Noooooooooooo!!!'],
          fontSize: 38, scale: easeOutBack(invLerp(1.25, 1.75, t)), fill: '#FEE2E2', textColor: '#DC2626'
        });
        break;
      }

      case 8: { // Panel 8: ULTRA-FUTURE MECH WEIRD GUY! "Whoa!!!" + Lava / water / Beep!!!
        bg = '#F5F3FF';
        const mS = easeOutBack(invLerp(0.1, 0.72, t));
        out += weirdGuy({ x: 96, y: 645, scale: 0.88, arms: 'up', eyes: 'angry', mouth: 'yell', t });
        out += futureWeirdGuy({ x: 242, y: 645, scale: 0.88, helmet: true, boots: true, t });
        out += ultraFutureMech({ x: 455, y: 495, scale: 1.02 * mS, t });

        // Labels & SFX
        out += `<g opacity="${invLerp(0.55, 1.0, t).toFixed(2)}">
          ${svgText(285, 225, 'Lava', { size: 34, fill: '#EA580C', rot: -10 })}
          ${handArrow(295, 245, 338, 322, 305, 290, '#EA580C')}
          ${svgText(545, 298, 'water', { size: 24, fill: '#0284C7' })}
          ${svgText(462, 138, 'Beep!!!', { size: 44, fill: '#4F46E5', rot: -8 })}
          ${svgText(242, 795, 'Beep!!!', { size: 30, fill: '#0891B2' })}
        </g>`;

        out += speechBubble({
          cx: 175, cy: 405, rx: 128, ry: 68,
          tailX: 112, tailY: 528, tail2X: 228, tail2Y: 528,
          lines: ['Whoa!!!'],
          fontSize: 44, scale: easeOutBack(invLerp(1.4, 1.9, t)), fill: '#FEF9C3', textColor: '#4F46E5'
        });
        break;
      }

      case 9: { // Panel 9: "I'm not high tech!!!" / "chika! chika!" / "shoom!!!" (Pod Tripod!)
        bg = '#F5F3FF';
        out += weirdGuy({ x: 108, y: 585, scale: 0.92, arms: 'out', eyes: 'angry', mouth: 'yell', t });
        out += futureWeirdGuy({ x: 258, y: 585, scale: 0.92, helmet: true, boots: true, t });
        out += ultraFuturePod({ x: 462, y: 515, scale: 1.0, mode: 'tripod', t });

        out += speechBubble({
          cx: 175, cy: 235, rx: 132, ry: 98,
          tailX: 118, tailY: 455,
          lines: ["I'm not", 'high', 'tech!!!'],
          fontSize: 34, scale: easeOutBack(invLerp(0.3, 0.8, t)), fill: '#FEF9C3', textColor: '#B91C1C'
        });
        out += svgMultiText(185, 725, ['chika!', 'chika!'], { size: 32, lineHeight: 34, fill: '#4F46E5', rot: -8, opacity: invLerp(1.05, 1.45, t) });
        out += svgText(458, 178, 'shoom!!!', { size: 54, fill: '#0284C7', rot: -6, opacity: invLerp(1.45, 1.85, t) });
        break;
      }

      case 10: { // Panel 10: "chom!!! click!!!" + "shrap!!!" (Twin Jet Pod!)
        bg = '#F5F3FF';
        out += weirdGuy({ x: 98, y: 555, scale: 0.94, eyes: 'normal', mouth: 'open', t });
        out += futureWeirdGuy({ x: 268, y: 555, scale: 0.94, helmet: false, boots: true, t });
        out += ultraFuturePod({ x: 468, y: 525, scale: 0.96, mode: 'jets', t });

        out += svgMultiText(268, 305, ['chom!!!', 'click!!!'], { size: 42, lineHeight: 46, fill: '#4F46E5', opacity: invLerp(0.15, 0.55, t) });
        out += svgText(455, 225, 'shrap!!!', { size: 58, fill: '#EA580C', rot: -8, opacity: invLerp(0.85, 1.25, t) });
        break;
      }

      case 11: { // Panel 11: "shoom!!! shing!!!" (Sleek Single-Thruster Hover Pod!)
        bg = '#F5F3FF';
        const hov = Math.sin(t * 7) * 8;
        out += weirdGuy({ x: 96, y: 555, scale: 0.96, eyes: 'normal', mouth: 'open', t });
        out += futureWeirdGuy({ x: 258, y: 555, scale: 0.98, helmet: false, boots: false, t });
        out += ultraFuturePod({ x: 468, y: 495 + hov, scale: 0.96, mode: 'hover', t });

        out += svgText(210, 235, 'shoom!!!', { size: 52, fill: '#0284C7', rot: -6, opacity: invLerp(0.15, 0.55, t) });
        out += svgText(468, 225, 'shing!!!', { size: 56, fill: '#7C3AED', rot: -8, opacity: invLerp(0.75, 1.15, t) });
        break;
      }

      case 12: { // Panel 12: "Shoom!!!" + Time Ray pops out of pod -> "zap!!!" / "Noooo!!!" / "Bye!!!"
        bg = '#F5F3FF';
        const zapping = t > 0.35;
        if (t > 0.35 && t < 1.35) shakeX = Math.sin(t * 64) * 5;

        out += svgText(455, 92, 'Shoom!!!', { size: 48, fill: '#0284C7', rot: -5, opacity: invLerp(0.08, 0.4, t) });
        out += weirdGuy({ x: 96, y: 565, scale: 0.92, eyes: 'angry', mouth: 'yell', t });
        out += futureWeirdGuy({ x: 265, y: 565, scale: 0.96, helmet: false, boots: false, t });
        out += ultraFuturePod({ x: 472, y: 515, scale: 0.94, mode: 'ray', t });

        if (zapping) {
          const j = Math.sin(t * 48) * 6;
          out += `<g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 465 325 L 335 ${(275 + j).toFixed(1)} L 215 ${(295 - j).toFixed(1)} L 125 ${(365 + j).toFixed(1)} L 105 462" stroke="#22D3EE" stroke-width="11" opacity="0.72"/>
            <path d="M 465 325 L 335 ${(275 + j).toFixed(1)} L 215 ${(295 - j).toFixed(1)} L 125 ${(365 + j).toFixed(1)} L 105 462" stroke="${INK}" stroke-width="3.4"/>
          </g>`;
          out += svgText(295, 375, 'zap!!!', { size: 58, fill: '#0891B2', rot: -10 });
        }

        out += speechBubble({
          cx: 112, cy: 735, rx: 88, ry: 52,
          tailX: 102, tailY: 660,
          lines: ['Noooo!!!'],
          fontSize: 30, scale: easeOutBack(invLerp(1.05, 1.5, t)), fill: '#FEE2E2', textColor: '#DC2626'
        });
        out += speechBubble({
          cx: 382, cy: 745, rx: 132, ry: 60,
          tailX: 278, tailY: 665, tail2X: 468, tail2Y: 665,
          lines: ['Bye!!!'],
          fontSize: 44, scale: easeOutBack(invLerp(1.75, 2.25, t)), fill: '#E0F2FE', textColor: '#0369A1'
        });
        break;
      }

      case 13: { // Panel 13: "Hi again!!! You're in the present!!!" + Standing on a Pyramid of Folding Chairs!
        out += svgMultiText(300, 125, ['Hi again!!!', "You're in the", 'present!!!'], {
          size: 48, lineHeight: 56, fill: '#1D4ED8', opacity: invLerp(0.08, 0.45, t)
        });

        // Pyramid of folding chairs!
        out += foldingChair({ x: 205, y: 695, scale: 0.78 });
        out += foldingChair({ x: 395, y: 695, scale: 0.78, seatColor: '#38BDF8' });
        out += foldingChair({ x: 300, y: 612, scale: 0.78, seatColor: '#818CF8' });
        out += foldingChair({ x: 300, y: 528, scale: 0.72, seatColor: '#60A5FA' });

        out += weirdGuy({ x: 298, y: 445, scale: 1.05, arms: 'up', eyes: 'angry', mouth: 'yell', t });
        break;
      }

      case 14: { // Panel 14: Prankster "kick!!!" + Tall stack of folding chairs crashes on Weird Guy! "ow, ow, ow, ow, ow, ow!!!"
        const kP = easeOutCubic(invLerp(0.25, 0.9, t));
        const drop = easeOutBounce(invLerp(0.45, 1.15, t));
        if (t > 0.75 && t < 1.15) shakeY = Math.sin(t * 72) * 6;

        out += prankster({ x: lerp(95, 148, kP), y: 595, scale: 1.18, kick: kP, t });
        out += svgText(215, 765, 'kick!!!', { size: 68, fill: '#EA580C', rot: -6, opacity: invLerp(0.45, 0.85, t) });

        // Flat squished Weird Guy under a tower of 5 folding chairs!
        out += weirdGuy({ x: 432, y: 645, scale: 0.96, rot: 90, eyes: 'squint', mouth: 'yell', t });
        const dy = lerp(-240, 0, drop);
        for (let i = 0; i < 5; i++) {
          out += foldingChair({ x: 425 + (i % 2 ? 6 : -6), y: 560 - i * 62 + dy, scale: 0.68, rot: (i % 2 ? 4 : -4), seatColor: i % 2 ? '#38BDF8' : '#60A5FA' });
        }

        out += speechBubble({
          cx: 452, cy: 765, rx: 112, ry: 58,
          tailX: 432, tailY: 688,
          lines: ['ow, ow, ow,', 'ow, ow, ow!!!'],
          fontSize: 22, scale: easeOutBack(invLerp(1.45, 1.95, t)), fill: '#FEE2E2', textColor: '#B91C1C'
        });
        break;
      }

      case 15: { // Panel 15: "The End" + Sore Weird Guy "owwww!!!"
        const endS = easeOutBack(invLerp(0.4, 1.0, t));
        out += `<g transform="translate(300 245) scale(${endS.toFixed(3)})">
          ${svgText(0, 16, 'The End', { size: 92, fill: INK })}
          <path d="M -165 44 Q 0 32 165 44" fill="none" stroke="#818CF8" stroke-width="5.5" stroke-linecap="round"/>
        </g>`;

        out += weirdGuy({ x: 422, y: 595, scale: 1.2, arms: 'out', eyes: 'angry', mouth: 'yell', t });
        out += speechBubble({
          cx: 215, cy: 525, rx: 142, ry: 88,
          tailX: 365, tailY: 545,
          lines: ['owwww!!!'],
          fontSize: 44, scale: easeOutBack(invLerp(1.5, 2.0, t)), fill: '#FEE2E2', textColor: '#B91C1C'
        });

        out += svgText(300, 810, 'The Weird Guy #11  •  By superbear1859', {
          size: 19, fill: '#475569', opacity: invLerp(2.6, 3.2, t) * 0.85
        });
        break;
      }
    }

    return wrapPanel(out, { panelNum: s.panelNum, shakeX, shakeY, bg });
  }

  function timeToScene(globalT) {
    const t = clamp(globalT, 0, TOTAL_DURATION);
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].end || i === SCENES.length - 1) return { sceneIdx: i, localT: t - SCENES[i].start };
    }
    return { sceneIdx: 0, localT: 0 };
  }

  // =========================================================================
  // REAL-TIME WEB AUDIO CARTOON SFX & CHATTER SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.16, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playSweep(f0, f1, dur, type = 'triangle', vol = 0.18, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f0), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, vol = 0.16, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = filterType; flt.frequency.setValueAtTime(filterFreq, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  function triggerCue(cue) {
    if (muted || !audioCtx) return;
    const tp = cue.type;
    if (tp === 'intro_jingle') {
      [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.18, i * 0.10));
    } else if (tp === 'outro_jingle') {
      [[523, 0.16, 0], [494, 0.16, 0.15], [466, 0.16, 0.30], [440, 0.42, 0.45]].forEach(([f, d, dl]) => playTone(f, d, 'triangle', 0.18, dl));
    } else if (tp === 'weird_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 560;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 150 - 55), 0.065, 'square', 0.08, i * 0.085);
    } else if (tp === 'future_talk') {
      const cnt = cue.count || 5;
      for (let i = 0; i < cnt; i++) playTone(380 + (i % 3) * 90, 0.075, 'sawtooth', 0.09, i * 0.095);
    } else if (tp === 'narrator_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 205;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 45 - 20), 0.10, 'sawtooth', 0.10, i * 0.115);
    } else if (tp === 'weird_yell') {
      const b = cue.pitch || 650;
      playSweep(b * 0.85, b * 1.25, 0.28, 'square', 0.12);
    } else if (tp === 'dramatic_chord') {
      [220, 261, 311].forEach(f => playTone(f, 0.55, 'sawtooth', 0.10));
    } else if (tp === 'robot_beep') {
      [880, 1175, 1046].forEach((f, i) => playTone(f, 0.08, 'sine', 0.14, i * 0.09));
    } else if (tp === 'mech_chika') {
      for (let i = 0; i < 4; i++) {
        playNoise(0.06, 0.18, 2200, 'highpass', i * 0.09);
        playTone(420 + (i % 2) * 240, 0.06, 'square', 0.09, i * 0.09);
      }
    } else if (tp === 'hologram_hum') {
      [523, 659, 784, 1046, 1318].forEach((f, i) => playTone(f, 0.26, 'sine', 0.12, i * 0.07));
    } else if (tp === 'shoom_retract') {
      playSweep(980, 240, 0.34, 'triangle', 0.18);
      playNoise(0.28, 0.16, 1400, 'bandpass');
    } else if (tp === 'shing_blade') {
      playSweep(1100, 2400, 0.28, 'sine', 0.18);
      playTone(1760, 0.30, 'triangle', 0.12, 0.06);
    } else if (tp === 'time_zap') {
      for (let i = 0; i < 6; i++) playSweep(420 + i * 160, 1400 - i * 120, 0.09, 'sawtooth', 0.14, i * 0.08);
      playSweep(1600, 260, 0.45, 'sine', 0.18, 0.42);
    } else if (tp === 'mech_reveal') {
      playSweep(160, 48, 0.45, 'sine', 0.26);
      [330, 440, 659, 880].forEach((f, i) => playTone(f, 0.22, 'sawtooth', 0.10, 0.12 + i * 0.08));
    } else if (tp === 'kick_whack') {
      playNoise(0.14, 0.26, 950, 'bandpass');
      playSweep(240, 880, 0.24, 'triangle', 0.20, 0.04);
    } else if (tp === 'chair_clatter') {
      playNoise(0.26, 0.24, 1800, 'bandpass');
      playTone(620, 0.14, 'square', 0.11, 0.02);
      playTone(430, 0.16, 'square', 0.11, 0.11);
      playSweep(180, 55, 0.22, 'sine', 0.24, 0.05);
    } else if (tp === 'giggle') {
      [720, 860, 780, 960].forEach((f, i) => playTone(f, 0.075, 'triangle', 0.13, i * 0.08));
    }
  }

  // =========================================================================
  // PLAYER STATE & UI
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const sceneBadge = document.getElementById('sceneBadge');
  const timeReadout = document.getElementById('timeReadout');
  const scrubber = document.getElementById('scrubber');
  const playOverlay = document.getElementById('playOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnMute = document.getElementById('btnMute');
  const speedSelect = document.getElementById('speedSelect');
  const sceneGrid = document.getElementById('sceneGrid');

  let currentTime = 0, playing = false, speed = 1.0, lastFrameTs = null;
  let firedCues = new Set(), activeSceneIdx = -1, hasInteracted = false;

  SCENES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-pill';
    btn.dataset.idx = i;
    btn.textContent = s.panelNum === null ? 'Cover' : `${s.panelNum}. ${s.title}`;
    btn.title = s.panelNum === null ? 'Cover' : `Panel ${s.panelNum}: ${s.title}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      seekTo(s.start + 0.01);
      setPlaying(true);
    });
    sceneGrid.appendChild(btn);
  });

  const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function updateUI() {
    const { sceneIdx, localT } = timeToScene(currentTime);
    const s = SCENES[sceneIdx];
    stageEl.innerHTML = renderScene(sceneIdx, localT);
    sceneBadge.textContent = `${s.panelNum === null ? 'Cover' : 'Panel ' + s.panelNum} • ${sceneIdx + 1} / ${SCENES.length}`;
    timeReadout.textContent = `${fmtTime(currentTime)} / ${fmtTime(TOTAL_DURATION)}`;
    scrubber.value = Math.round((currentTime / TOTAL_DURATION) * 1000);
    if (sceneIdx !== activeSceneIdx) {
      activeSceneIdx = sceneIdx;
      for (const el of sceneGrid.children) {
        const isCur = Number(el.dataset.idx) === sceneIdx;
        el.className = isCur ? 'scene-pill active' : 'scene-pill';
      }
      if (hasInteracted && window.WeirdGuyProgress) {
        window.WeirdGuyProgress.save('11', sceneIdx, SCENES.length, currentTime >= TOTAL_DURATION - 0.1);
      }
    }
  }

  function seekTo(t) {
    hasInteracted = true;
    currentTime = clamp(t, 0, TOTAL_DURATION);
    firedCues = new Set();
    for (const c of AUDIO_CUES) if (c.globalT < currentTime - 0.05) firedCues.add(c.id);
    updateUI();
  }

  function setPlaying(val) {
    playing = val;
    playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    playLabel.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      hasInteracted = true;
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      if (currentTime >= TOTAL_DURATION - 0.05) seekTo(0);
      lastFrameTs = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.08, (now - lastFrameTs) / 1000) * speed;
    lastFrameTs = now;
    currentTime = Math.min(TOTAL_DURATION, currentTime + dt);
    for (const c of AUDIO_CUES) {
      if (!firedCues.has(c.id) && c.globalT <= currentTime) {
        firedCues.add(c.id);
        triggerCue(c);
      }
    }
    updateUI();
    if (currentTime >= TOTAL_DURATION) {
      if (window.WeirdGuyProgress) window.WeirdGuyProgress.save('11', SCENES.length - 1, SCENES.length, true);
      setPlaying(false);
    }
    else requestAnimationFrame(tick);
  }

  btnPlay.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('stageContainer').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('overlayPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); setPlaying(true); });
  btnRestart.addEventListener('click', () => { seekTo(0); setPlaying(true); });
  btnPrev.addEventListener('click', () => seekTo(SCENES[Math.max(0, activeSceneIdx - 1)].start + 0.01));
  btnNext.addEventListener('click', () => seekTo(SCENES[Math.min(SCENES.length - 1, activeSceneIdx + 1)].start + 0.01));
  scrubber.addEventListener('input', () => seekTo((Number(scrubber.value) / 1000) * TOTAL_DURATION));
  speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value) || 1; });
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.innerHTML = muted ? '&#128263; Muted' : '&#128266; Sound On';
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'm' || e.key === 'M') { btnMute.click(); }
  });

  window.WeirdGuyVolume = {
    id: '11',
    number: 11,
    title: 'Is He Dead in the Future??',
    edition: 'Blank Edition!!!',
    author: 'superbear1859',
    scenes: SCENES,
    renderScene: renderScene
  };

  const initialScene = window.WeirdGuyProgress ? window.WeirdGuyProgress.getInitialSceneFromHash(SCENES.length) : null;
  if (initialScene !== null && initialScene > 0) {
    currentTime = SCENES[initialScene].start + 0.01;
    updateUI();
  } else {
    currentTime = 3.4;
    updateUI();
    currentTime = 0;
    scrubber.value = 0;
    timeReadout.textContent = `0:00 / ${fmtTime(TOTAL_DURATION)}`;
  }
})();
