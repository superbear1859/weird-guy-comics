  const FONT = "'Humor Sans', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif";

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeInOutCubic = t => {
    t = clamp(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  const easeOutBack = (t, s = 1.70158) => {
    t = clamp(t) - 1;
    return 1 + (s + 1) * t * t * t + s * t * t;
  };
  const easeOutElastic = t => {
    t = clamp(t);
    if (t === 0 || t === 1) return t;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
  };
  const easeOutBounce = t => {
    t = clamp(t);
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;

  // --- SVG Primitives ---
  const esc = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function svgText(x, y, text, opts = {}) {
    const { size = 28, weight = '700', fill = INK, anchor = 'middle', rot = 0, opacity = 1, stroke = 'none', strokeWidth = 0, letterSpacing = 0.3 } = opts;
    if (opacity <= 0.005) return '';
    const tf = rot ? ` transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"` : '';
    const st = stroke !== 'none' ? ` stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" paint-order="stroke"` : '';
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${FONT}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${letterSpacing}" opacity="${opacity.toFixed(3)}"${st}${tf}>${esc(text)}</text>`;
  }

  function svgMultiText(x, y, lines, opts = {}) {
    const lineH = opts.lineHeight || (opts.size || 24) * 1.18;
    const startY = y - ((lines.length - 1) * lineH) / 2;
    return lines.map((line, i) => svgText(x, startY + i * lineH, line, opts)).join('');
  }

  function speechBubble(opts) {
    const { cx, cy, rx, ry, tailX, tailY, lines = [], fontSize = 22, lineHeight, fill = '#FFFFFF', stroke = INK, strokeWidth = 3.2, textColor = INK, spiky = false, scale = 1, opacity = 1, rot = 0 } = opts;
    if (opacity <= 0.005 || scale <= 0.01) return '';
    let shape = '';
    if (spiky) {
      const spikes = 16, pts = [];
      for (let i = 0; i < spikes * 2; i++) {
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const m = i % 2 === 0 ? 1.12 : 0.88;
        pts.push(`${(Math.cos(a) * rx * m).toFixed(1)},${(Math.sin(a) * ry * m).toFixed(1)}`);
      }
      let tail = '';
      if (tailX !== undefined && tailY !== undefined) {
        const dx = tailX - cx, dy = tailY - cy, ang = Math.atan2(dy, dx);
        tail = `<path d="M ${(Math.cos(ang - 0.25) * rx * 0.72).toFixed(1)} ${(Math.sin(ang - 0.25) * ry * 0.72).toFixed(1)} L ${dx.toFixed(1)} ${dy.toFixed(1)} L ${(Math.cos(ang + 0.25) * rx * 0.72).toFixed(1)} ${(Math.sin(ang + 0.25) * ry * 0.72).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      shape = `${tail}<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>`;
    } else {
      const k = 0.55228;
      const d = [
        `M 0 ${(-ry).toFixed(1)}`,
        `C ${(rx * k * 1.03).toFixed(1)} ${(-ry * 0.99).toFixed(1)}, ${(rx * 1.02).toFixed(1)} ${(-ry * k).toFixed(1)}, ${(rx * 0.99).toFixed(1)} 0`,
        `C ${(rx * 1.01).toFixed(1)} ${(ry * k * 1.02).toFixed(1)}, ${(rx * k).toFixed(1)} ${(ry * 1.02).toFixed(1)}, 0 ${(ry * 0.99).toFixed(1)}`,
        `C ${(-rx * k * 1.02).toFixed(1)} ${(ry * 1.01).toFixed(1)}, ${(-rx * 1.02).toFixed(1)} ${(ry * k).toFixed(1)}, ${(-rx * 0.99).toFixed(1)} 0`,
        `C ${(-rx * 1.01).toFixed(1)} ${(-ry * k * 1.02).toFixed(1)}, ${(-rx * k).toFixed(1)} ${(-ry * 1.02).toFixed(1)}, 0 ${(-ry).toFixed(1)} Z`
      ].join(' ');
      let tail = '', maskPatch = '';
      if (tailX !== undefined && tailY !== undefined) {
        const dx = tailX - cx, dy = tailY - cy, ang = Math.atan2(dy, dx);
        const b1x = Math.cos(ang - 0.24) * rx * 0.85, b1y = Math.sin(ang - 0.24) * ry * 0.85;
        const b2x = Math.cos(ang + 0.24) * rx * 0.85, b2y = Math.sin(ang + 0.24) * ry * 0.85;
        const midX = (b1x + b2x) * 0.35 + dx * 0.35, midY = (b1y + b2y) * 0.35 + dy * 0.35;
        tail = `<path d="M ${b1x.toFixed(1)} ${b1y.toFixed(1)} Q ${midX.toFixed(1)} ${midY.toFixed(1)} ${dx.toFixed(1)} ${dy.toFixed(1)} Q ${(midX + (b2x - b1x) * 0.3).toFixed(1)} ${(midY + (b2y - b1y) * 0.3).toFixed(1)} ${b2x.toFixed(1)} ${b2y.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round" stroke-linecap="round"/>`;
        maskPatch = `<path d="M ${(b1x * 0.95).toFixed(1)} ${(b1y * 0.95).toFixed(1)} L ${(dx * 0.78).toFixed(1)} ${(dy * 0.78).toFixed(1)} L ${(b2x * 0.95).toFixed(1)} ${(b2y * 0.95).toFixed(1)} Z" fill="${fill}" stroke="none"/>`;
      }
      shape = `${tail}<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linejoin="round"/>${maskPatch}`;

  function handArrow(x1, y1, x2, y2, cx, cy, color = INK) {

  // Sci-Fi Ray Gun (Giant Ray in Panels 8 & 9, Tiny Ray in Panel 13!)
  function rayGun({ x, y, scale = 1, rot = 0, labelLines = ['Giant', 'ray'], bodyFill = '#E2E8F0', accent = '#FACC15', zapping = false, zapLen = 190, t = 0 }) {
    const jitter = zapping ? Math.sin(t * 60) * 3 : 0;
    let zapSvg = '';
    if (zapping && zapLen > 10) {
      const segs = 6;
      let d1 = 'M -62 0', d2 = 'M -62 8';
      for (let i = 1; i <= segs; i++) {
        const px = -62 - (zapLen * i) / segs;
        const py = (i % 2 === 0 ? -18 : 18) + Math.sin(t * 45 + i * 2) * 6;
        d1 += ` L ${px.toFixed(1)} ${(py - 6).toFixed(1)}`;
        d2 += ` L ${px.toFixed(1)} ${(py + 12).toFixed(1)}`;
      }
      zapSvg = `<g>
        <path d="${d1}" fill="none" stroke="${accent}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <path d="${d1}" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${d2}" fill="none" stroke="${accent}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
        <path d="${d2}" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${(-62 - zapLen).toFixed(1)}" cy="4" r="${(16 + Math.sin(t * 40) * 5).toFixed(1)}" fill="${accent}" opacity="0.75"/>
      </g>`;
    }

    return `<g transform="translate(${(x + jitter).toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})">
      ${zapSvg}
      <!-- Top cylinder scope -->

      <ellipse cx="-42" cy="-58" rx="11" ry="18" fill="${INK}"/>

  function renderScene(sceneIdx, localT) {
    const s = SCENES[sceneIdx];
    const t = clamp(localT, 0, s.duration);
    let out = '', shakeX = 0, shakeY = 0, bg = PAPER;

    switch (sceneIdx) {
      // ---------------------------------------------------------------------
      // SCENE 0: COVER — "#5 BLANK edition! The weird guy: Poop is yummy!!!"

      case 0: {
        const bS = easeOutBack(invLerp(0.05, 0.45, t));

        const gY = lerp(695, 565, easeOutBack(invLerp(0.42, 1.05, t))) + Math.sin(t * 5) * 3;

        out += `<g opacity="${tOp.toFixed(3)}">

        out += weirdGuy({ x: 245, y: gY, scale: 1.18, plateProp: true, eyes: 'shock', mouth: 'open', t });

          cx: 462, cy: 465, rx: 108, ry: 78,

        });

        out += `<g opacity="${aOp.toFixed(3)}">

      // ---------------------------------------------------------------------

      // ---------------------------------------------------------------------
      case 1: {
        const plateX = lerp(90, 185, easeOutCubic(invLerp(0.15, 0.75, t)));

          cx: 332, cy: 298, rx: 92, ry: 58,

      // SCENE 2: PANEL 2 — Prankster shoves the poop plate! "Nooo!!!"
      // ---------------------------------------------------------------------
      case 2: {

        const plateX = lerp(248, 342, shove);
        const guyX = lerp(422, 444, shove);
        const guyRot = lerp(0, 10, shove);
        if (t > 0.9 && t < 1.35) {
          shakeX = Math.sin(t * 70) * 5;

        out += prankster({ x: pX, y: 446, scale: 1.22, pushReach: shove, t });

        });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 3: PANEL 3 — "Gobble! Chomp!" + "nooo!!!"
      // ---------------------------------------------------------------------
      case 3: {
        const fallP = easeOutCubic(invLerp(0.1, 0.9, t));
        const plX = lerp(245, 128, fallP);
        const plY = lerp(455, 395, fallP);
        const plRot = lerp(-10, -28, fallP);
        const chompJitter = Math.sin(t * 36) * 4;

        out += dinnerPlate({ x: plX, y: plY, scale: 0.95, rot: plRot });
        // Motion lines behind flying empty plate
        out += `<g stroke="${INK}" stroke-width="2.8" stroke-linecap="round" opacity="0.55">
          <line x1="185" y1="365" x2="232" y2="375"/>

        </g>`;

        out += weirdGuy({ x: 355 + chompJitter, y: 495, scale: 1.12, rot: 28, arms: 'out', legs: 'flail', eyes: 'angry', mouth: 'chomp', t });

        // Gobble! & Chomp! comic SFX popping in
        const gS = easeOutBack(invLerp(0.3, 0.7, t));
        const cS = easeOutBack(invLerp(1.1, 1.5, t));
        out += `<g transform="translate(275 268) rotate(-8) scale(${gS.toFixed(3)})">
          ${svgText(0, 0, 'Gobble!', { size: 54, fill: '#D97706', stroke: '#FFF', strokeWidth: 6 })}

        out += `<g transform="translate(458 338) rotate(8) scale(${cS.toFixed(3)})">

      case 4: {

      // ---------------------------------------------------------------------
      case 5: {
        const popS = easeOutElastic(invLerp(0.05, 0.75, t));
        const wob = Math.sin(t * 16) * 2.5;
        out += poopPile({ x: 300, y: 390, scale: 1.75 * popS, rot: wob, t, stink: true, stinkCount: 4, stinkHeight: 130 });

        out += speechBubble({
          cx: 318, cy: 655, rx: 132, ry: 86,

          fontSize: 44, scale: easeOutBack(invLerp(0.95, 1.45, t)), fill: '#FEE2E2', textColor: '#B91C1C'
        });

      }

      // ---------------------------------------------------------------------
      // SCENE 6: PANEL 6 — Lava bucket pours onto Weird-Guy-poop! "Ahhh!!!"
      // ---------------------------------------------------------------------
      case 6: {
        const pour = invLerp(0.25, 1.35, t);
        const w = Math.sin(t * 16) * 10;
        const sh = pour > 0.4 ? Math.sin(t * 50) * 3 : 0;

        // Pouring molten lava river
        if (pour > 0.02) {
          const bottomY = lerp(175, 735, easeOutCubic(pour));
          out += `<g opacity="0.88">
            <path d="M 218 165 C ${(195 + w).toFixed(1)} 340, ${(135 - w).toFixed(1)} 520, 155 ${bottomY.toFixed(1)} C 215 ${(bottomY + 42).toFixed(1)}, 385 ${(bottomY + 38).toFixed(1)}, 425 ${(bottomY - 25).toFixed(1)} C ${(455 + w).toFixed(1)} 480, ${(395 - w).toFixed(1)} 330, 355 165 Z"
                  fill="#F97316" stroke="#DC2626" stroke-width="4" stroke-linejoin="round"/>
            <path d="M 248 210 C ${(225 - w).toFixed(1)} 360, ${(195 + w).toFixed(1)} 510, 215 ${(bottomY - 40).toFixed(1)}"
                  fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
            <path d="M 325 230 C ${(355 + w).toFixed(1)} 390, ${(365 - w).toFixed(1)} 520, 335 ${(bottomY - 55).toFixed(1)}"
                  fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
          </g>`;

        // Upside-down lava bucket at top
        out += bucket({ x: 285, y: 112, rot: 180, fill: '#E2E8F0', rimFill: '#F97316', scale: 1.05 });

        // Weird-Guy-poop trapped inside the lava!
        out += poopPile({ x: 290 + sh, y: 585, scale: 1.25, t, stink: true, stinkCount: 2, stinkHeight: 75 });

      case 7: {

    return wrapPanel(out, { panelNum: s.panelNum, shakeX, shakeY, bg });

  function timeToScene(globalT) {
    const t = clamp(globalT, 0, TOTAL_DURATION);
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].end || i === SCENES.length - 1) return { sceneIdx: i, localT: t - SCENES[i].start };
    }
    return { sceneIdx: 0, localT: 0 };
  }

  // =========================================================================
  // REAL-TIME WEB AUDIO CARTOON SFX & CHATTER SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.16, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playSweep(f0, f1, dur, type = 'triangle', vol = 0.18, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f0), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, vol = 0.16, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = filterType; flt.frequency.setValueAtTime(filterFreq, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  function triggerCue(cue) {
    if (muted || !audioCtx) return;
    const tp = cue.type;
    if (tp === 'intro_jingle') {
      [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.18, i * 0.10));
    } else if (tp === 'outro_jingle') {
      [[523, 0.16, 0], [494, 0.16, 0.15], [466, 0.16, 0.30], [440, 0.42, 0.45]].forEach(([f, d, dl]) => playTone(f, d, 'triangle', 0.18, dl));
    } else if (tp === 'weird_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 560;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 150 - 55), 0.065, 'square', 0.08, i * 0.085);
    } else if (tp === 'narrator_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 205;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 45 - 20), 0.10, 'sawtooth', 0.10, i * 0.115);
    } else if (tp === 'weird_yell') {
      const b = cue.pitch || 660;
      playSweep(b * 0.85, b * 1.25, 0.28, 'square', 0.12);
    } else if (tp === 'ew_groan') {
      playSweep(640, 260, 0.42, 'sawtooth', 0.12);
      playSweep(520, 210, 0.38, 'triangle', 0.12, 0.05);
    } else if (tp === 'chomp_gobble') {
      for (let i = 0; i < 3; i++) {
        playSweep(320, 110, 0.09, 'square', 0.13, i * 0.13);
        playNoise(0.07, 0.18, 900, 'bandpass', i * 0.13);
      }
    } else if (tp === 'morph_squish') {
      for (let i = 0; i < 6; i++) {
        playSweep(480 - i * 48, 220 + (i % 2) * 140, 0.11, 'sine', 0.15, i * 0.11);
      }
      playNoise(0.35, 0.14, 650, 'bandpass', 0.15);
    } else if (tp === 'thud') {
      playSweep(150, 42, 0.24, 'sine', 0.26);
      playNoise(0.15, 0.20, 280, 'lowpass');
    } else if (tp === 'poop_horn') {
      playSweep(190, 92, 0.45, 'sawtooth', 0.20);
      playSweep(140, 68, 0.40, 'square', 0.11, 0.04);
    } else if (tp === 'lava_sizzle') {
      playNoise(1.0, 0.22, 2400, 'highpass');
      for (let i = 0; i < 6; i++) playSweep(160 + i * 24, 310 + i * 32, 0.09, 'sine', 0.10, i * 0.11);
    } else if (tp === 'fall_whistle') {
      playSweep(1080, 210, 0.65, 'sine', 0.18);
    } else if (tp === 'boing_spring') {
      for (let i = 0; i < 7; i++) {
        const f0 = 180 + i * 45;
        playSweep(f0, f0 + 180, 0.08, 'triangle', 0.22 - i * 0.02, i * 0.075);
      }
    } else if (tp === 'ray_charge') {
      playSweep(240, 920, 0.42, 'sine', 0.14);
      playSweep(260, 960, 0.42, 'triangle', 0.09, 0.04);
    } else if (tp === 'zap_grow') {
      for (let i = 0; i < 5; i++) playSweep(1200, 340, 0.08, 'sawtooth', 0.15, i * 0.085);
      playSweep(420, 95, 0.72, 'sawtooth', 0.18, 0.25);
    } else if (tp === 'zap_shrink') {
      for (let i = 0; i < 4; i++) playSweep(980, 1650, 0.07, 'square', 0.12, i * 0.075);
      playSweep(320, 1580, 0.60, 'sine', 0.18, 0.22);
    } else if (tp === 'stink_wind') {
      playNoise(0.95, 0.18, 520, 'bandpass');
      playSweep(240, 180, 0.75, 'sine', 0.10, 0.05);
    } else if (tp === 'giggle') {
      [720, 860, 780, 960].forEach((f, i) => playTone(f, 0.075, 'triangle', 0.13, i * 0.08));
    } else if (tp === 'evil_laugh') {
      [310, 290, 275, 320, 285, 260, 240, 220].forEach((f, i) => playTone(f, 0.085, 'sawtooth', 0.12, i * 0.105));
    } else if (tp === 'rage_arggh') {
      playSweep(460, 720, 0.45, 'sawtooth', 0.15);
    } else if (tp === 'ding') {
      playTone(1046.5, 0.35, 'sine', 0.16);
      playTone(1568, 0.32, 'sine', 0.11, 0.06);
    }
  }

  // =========================================================================
  // PLAYER STATE & UI
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const sceneBadge = document.getElementById('sceneBadge');
  const timeReadout = document.getElementById('timeReadout');
  const scrubber = document.getElementById('scrubber');
  const playOverlay = document.getElementById('playOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnMute = document.getElementById('btnMute');
  const speedSelect = document.getElementById('speedSelect');
  const sceneGrid = document.getElementById('sceneGrid');

  let currentTime = 0, playing = false, speed = 1.0, lastFrameTs = null;
  let firedCues = new Set(), activeSceneIdx = -1, hasInteracted = false;

  SCENES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-pill';
    btn.dataset.idx = i;
    btn.textContent = s.panelNum === null ? 'Cover' : `${s.panelNum}. ${s.title}`;
    btn.title = s.panelNum === null ? 'Cover' : `Panel ${s.panelNum}: ${s.title}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      seekTo(s.start + 0.01);
      setPlaying(true);
    });
    sceneGrid.appendChild(btn);
  });

  const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function updateUI() {
    const { sceneIdx, localT } = timeToScene(currentTime);
    const s = SCENES[sceneIdx];
    stageEl.innerHTML = renderScene(sceneIdx, localT);
    sceneBadge.textContent = `${s.panelNum === null ? 'Cover' : 'Panel ' + s.panelNum} • ${sceneIdx + 1} / ${SCENES.length}`;
    timeReadout.textContent = `${fmtTime(currentTime)} / ${fmtTime(TOTAL_DURATION)}`;
    scrubber.value = Math.round((currentTime / TOTAL_DURATION) * 1000);
    if (sceneIdx !== activeSceneIdx) {
      activeSceneIdx = sceneIdx;
      for (const el of sceneGrid.children) {
        const isCur = Number(el.dataset.idx) === sceneIdx;
        el.className = isCur ? 'scene-pill active' : 'scene-pill';
      }
      if (hasInteracted && window.WeirdGuyProgress) {
        window.WeirdGuyProgress.save('05', sceneIdx, SCENES.length, currentTime >= TOTAL_DURATION - 0.1);
      }
    }
  }

  function seekTo(t) {
    hasInteracted = true;
    currentTime = clamp(t, 0, TOTAL_DURATION);
    firedCues = new Set();
    for (const c of AUDIO_CUES) if (c.globalT < currentTime - 0.05) firedCues.add(c.id);
    updateUI();
  }

  function setPlaying(val) {
    playing = val;
    playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    playLabel.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      hasInteracted = true;
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      if (currentTime >= TOTAL_DURATION - 0.05) seekTo(0);
      lastFrameTs = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.08, (now - lastFrameTs) / 1000) * speed;
    lastFrameTs = now;
    currentTime = Math.min(TOTAL_DURATION, currentTime + dt);
    for (const c of AUDIO_CUES) {
      if (!firedCues.has(c.id) && c.globalT <= currentTime) {
        firedCues.add(c.id);
        triggerCue(c);
      }
    }
    updateUI();
    if (currentTime >= TOTAL_DURATION) {
      if (window.WeirdGuyProgress) window.WeirdGuyProgress.save('05', SCENES.length - 1, SCENES.length, true);
      setPlaying(false);
    }
    else requestAnimationFrame(tick);
  }

  btnPlay.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('stageContainer').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('overlayPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); setPlaying(true); });
  btnRestart.addEventListener('click', () => { seekTo(0); setPlaying(true); });
  btnPrev.addEventListener('click', () => seekTo(SCENES[Math.max(0, activeSceneIdx - 1)].start + 0.01));
  btnNext.addEventListener('click', () => seekTo(SCENES[Math.min(SCENES.length - 1, activeSceneIdx + 1)].start + 0.01));
  scrubber.addEventListener('input', () => seekTo((Number(scrubber.value) / 1000) * TOTAL_DURATION));
  speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value) || 1; });
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.innerHTML = muted ? '&#128263; Muted' : '&#128266; Sound On';
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'm' || e.key === 'M') { btnMute.click(); }
  });

  // Expose volume hook for assets/print.js (Fold & Staple Booklet + 32/48-card Thumb-Flipbook)
  window.WeirdGuyVolume = {
    id: '05',
    number: 5,
    title: 'Poop is Yummy!!!',
    edition: 'Blank Edition!',
    author: 'superbear1859',
    scenes: SCENES,
    renderScene: renderScene
  };

  // Render full cover showcase frame initially (or jump to saved #scene=N)
  const initialScene = window.WeirdGuyProgress ? window.WeirdGuyProgress.getInitialSceneFromHash(SCENES.length) : null;
  if (initialScene !== null && initialScene > 0) {
    currentTime = SCENES[initialScene].start + 0.01;
    updateUI();
  } else {
    currentTime = 3.2;
    updateUI();
    currentTime = 0;
    scrubber.value = 0;
    timeReadout.textContent = `0:00 / ${fmtTime(TOTAL_DURATION)}`;
  }
})();
</script>
  <script src="../../assets/print.js?v=2"></script>
</body>
