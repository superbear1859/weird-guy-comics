  const easeInOutCubic = t => {
    t = clamp(t);

  const easeOutBack = (t, s = 1.70158) => {
    t = clamp(t) - 1;

  const easeOutElastic = t => {
    t = clamp(t);

  const esc = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function svgText(x, y, text, opts = {}) {
    const { size = 28, weight = '700', fill = INK, anchor = 'middle', rot = 0, opacity = 1, stroke = 'none', strokeWidth = 0, letterSpacing = 0.3 } = opts;

    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})" opacity="${opacity.toFixed(3)}">

  // Big, Blank Edition Paper Wrapper (matches Vol. 2 clean white comic paper + subtle halftone!)
  function wrapPanel(innerSvg, { panelNum = null, shakeX = 0, shakeY = 0 } = {}) {

  function renderScene(sceneIdx, localT) {
    const s = SCENES[sceneIdx];

    let out = '', shakeX = 0, shakeY = 0;

    switch (sceneIdx) {
      // ---------------------------------------------------------------------
      // SCENE 0: COVER — "#4 Big, Blank Edition! The weird guy: Don't try new things"
      // ---------------------------------------------------------------------
      case 0: {
        const bS = easeOutBack(invLerp(0.05, 0.45, t));

        out += `<g opacity="${tOp.toFixed(3)}">
          ${svgText(300, 178, 'The weird guy:', { size: 54 })}
          ${svgText(300, 240, "Don't try new things", { size: 46, fill: '#2563EB', stroke: INK, strokeWidth: 1.5 })}
        </g>`;

        out += weirdGuy({ x: 238, y: gY, scale: 1.2, comicProp: true, t });
        out += speechBubble({
          cx: 452, cy: 468, rx: 118, ry: 96,

        });

        out += `<g opacity="${aOp.toFixed(3)}">
          ${svgText(200, 775, 'By: superbear1859', { size: 30, rot: -1.5 })}
          <path d="M 62 787 Q 200 779 338 785" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

      // ---------------------------------------------------------------------
      // SCENE 1: PANEL 1 — "You got new shoes!" / "They are too big!"
      // ---------------------------------------------------------------------
      case 1: {
        const dropS = easeOutBounce(invLerp(0.35, 0.95, t));
        out += svgMultiText(275, 118, ['You got new', 'shoes!'], { size: 54, lineHeight: 62, fill: '#1D4ED8', opacity: invLerp(0.08, 0.45, t) });

        out += speechBubble({ cx: 446, cy: 360, rx: 112, ry: 74, tailX: 318, tailY: 472, lines: ['They are', 'too big!'], fontSize: 30, scale: easeOutBack(invLerp(1.3, 1.75, t)), fill: '#FEF9C3' });

      // ---------------------------------------------------------------------
      // SCENE 2: PANEL 2 — Tripping in the giant shoes! "Whoa!"
      // ---------------------------------------------------------------------
      case 2: {
        const tripP = easeInOutCubic(invLerp(0.15, 1.7, t));
        const rot = lerp(-6, 26, tripP);

        out += `<g stroke="${INK}" stroke-width="3.8" stroke-linecap="round" opacity="${invLerp(0.25, 0.7, t).toFixed(2)}">

        out += speechBubble({ cx: 452, cy: 235, rx: 92, ry: 62, tailX: gX + 38, tailY: 365, lines: ['Whoa!'], fontSize: 38, scale: easeOutBack(invLerp(0.85, 1.3, t)), fill: '#FEF2F2', textColor: '#DC2626' });

      // ---------------------------------------------------------------------
      // SCENE 3: PANEL 3 — Plunging head-first into a pit of LAVA! "Ooh!"
      // ---------------------------------------------------------------------
      case 3: {
        const fallT = easeOutBounce(invLerp(0.2, 0.9, t));
        const guyY = lerp(280, 622, fallT);
        const w = Math.sin(t * 14) * 8;

        // Bubbling Lava Pit box at bottom-right!
        out += `<g>
          <rect x="260" y="545" width="286" height="240" rx="10" fill="#F97316" stroke="#DC2626" stroke-width="4"/>
          <path d="M 260 562 Q ${(330 + w).toFixed(1)} 538 403 562 T 546 562 L 546 785 L 260 785 Z" fill="#FB923C" stroke="#DC2626" stroke-width="3.5"/>
          <path d="M 285 618 Q ${(360 - w).toFixed(1)} 602 440 622 T 522 615" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>

        // "Arggh!" bubble inside lava pit
        out += speechBubble({ cx: 482, cy: 718, rx: 82, ry: 46, tailX: 428, tailY: 678, lines: ['Arggh!'], fontSize: 28, scale: easeOutBack(invLerp(1.45, 1.9, t)), fill: '#FEF9C3', textColor: '#DC2626' });

      // ---------------------------------------------------------------------
      // SCENE 4: PANEL 4 — "Your nose and butt are on fire!!!"
      // ---------------------------------------------------------------------
      case 4: {

      // ---------------------------------------------------------------------

      case 5: {

        out += speechBubble({ cx: 442, cy: 295, rx: 102, ry: 60, tailX: 372, tailY: 432, lines: ['Achoo!!'], fontSize: 36, scale: easeOutBack(invLerp(1.0, 1.45, t)), spiky: true, fill: '#FEF9C3' });

        // Blasting fiery green-orange snot globs!

          out += `<g opacity="${clamp(snotP * 1.4).toFixed(2)}">

      // ---------------------------------------------------------------------
      // SCENE 6: PANEL 6 — "You poop fiery poop!!!" + "I pooped!!!!"
      // ---------------------------------------------------------------------
      case 6: {
        const poopS = easeOutBack(invLerp(1.0, 1.55, t));

        out += weirdGuy({ x: 220, y: 560, scale: 1.08, giantShoes: true, shoeScale: 1.15, noseFire: true, buttFire: true, arms: 'up', eyes: 'normal', mouth: 'yell', t });
        out += speechBubble({ cx: 435, cy: 290, rx: 118, ry: 66, tailX: 282, tailY: 432, lines: ['I pooped!!!!'], fontSize: 32, scale: easeOutBack(invLerp(1.8, 2.25, t)), fill: '#DCFCE7', textColor: '#15803D' });

        // Flaming fiery poop coil on bottom-right!
        if (poopS > 0.02) {

            <path d="M -52 28 L -66 -18 L -34 -12 L -28 -58 L 2 -32 L 26 -62 L 38 -14 L 68 -24 L 54 32 Z" fill="#F97316" stroke="#DC2626" stroke-width="3.2" stroke-linejoin="round"/>

          out += `<g opacity="${clamp(poopS).toFixed(2)}">

      // ---------------------------------------------------------------------

      case 7: {

        out += speechBubble({ cx: 432, cy: 275, rx: 128, ry: 88, tailX: 332, tailY: 412, lines: ['My whole', 'body is', 'on fire!!!'], fontSize: 30, scale: easeOutBack(invLerp(0.95, 1.45, t)), spiky: true, fill: '#FEF9C3', textColor: '#B91C1C' });

        if (spP > 0.02) {

          out += `<g opacity="${clamp(spP * 1.3).toFixed(2)}">
            ${handArrow(112, 412, 126, 444, 108, 430, '#DC2626')}
            ${svgMultiText(105, 368, ['fiery', 'spit'], { size: 28, lineHeight: 30, fill: '#DC2626' })}
          </g>`;

      // ---------------------------------------------------------------------
      // SCENE 9: PANEL 9 — "You barf fiery barf!!!!!!!" + "Blek!!!"
      // ---------------------------------------------------------------------
      case 9: {
        const bfP = easeOutCubic(invLerp(1.0, 1.75, t));
        out += svgMultiText(300, 108, ['You barf fiery', 'barf!!!!!!!'], { size: 46, lineHeight: 54, fill: '#DC2626', opacity: invLerp(0.08, 0.45, t) });
        out += weirdGuy({ x: 382, y: 560, scale: 1.08, giantShoes: true, shoeScale: 1.12, noseFire: true, bodyFire: true, eyes: 'squint', mouth: 'yell', t });
        out += speechBubble({ cx: 495, cy: 315, rx: 88, ry: 56, tailX: 420, tailY: 448, lines: ['Blek!!!'], fontSize: 34, scale: easeOutBack(invLerp(1.0, 1.45, t)), fill: '#FEF9C3', textColor: '#B91C1C' });

        // Huge roaring wave of fiery barf!
        if (bfP > 0.02) {
          out += `<g transform="translate(345 505) scale(${bfP.toFixed(3)} 1)">
            <path d="M 0 0 C -85 -45, -180 -95, -295 -60 L -265 45 L -305 135 C -185 185, -80 95, 0 28 Z"
                  fill="#F97316" stroke="#DC2626" stroke-width="3.8" stroke-linejoin="round" opacity="0.92"/>
            <path d="M -20 6 C -95 -28, -175 -52, -255 -20 L -235 65 C -160 112, -85 62, -20 18 Z"
                  fill="#A3E635" opacity="0.72"/>
          </g>`;
          out += `<g opacity="${clamp(bfP * 1.3).toFixed(2)}">
            ${handArrow(130, 355, 165, 425, 160, 385, '#DC2626')}
            ${svgMultiText(118, 305, ['fiery', 'barf'], { size: 30, lineHeight: 32, fill: '#DC2626' })}
          </g>`;
        }
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 10: PANEL 10 — "That is enough fire!!!" + "← ultra hyper cold water!!" + "So cold!!!"
      // ---------------------------------------------------------------------
      case 10: {
        const pY = lerp(-70, 265, easeOutBack(invLerp(0.4, 0.9, t)));
        const tip = lerp(45, 156, easeInOutCubic(invLerp(0.85, 1.3, t)));
        const wp = invLerp(1.1, 1.9, t);
        const shiver = (t > 1.7) ? Math.sin(t * 58) * 4 : 0;

        out += svgMultiText(235, 108, ['That is enough', 'fire!!!'], { size: 46, lineHeight: 54, fill: '#1D4ED8', opacity: invLerp(0.08, 0.45, t) });

        // Weird Guy extinguished & shivering in icy water!
        out += weirdGuy({ x: 300 + shiver, y: 580, scale: 1.08, giantShoes: true, shoeScale: 1.15, shoesWet: wp > 0.4, shoeSoggy: wp, bodyFire: wp < 0.35, eyes: wp > 0.35 ? 'squint' : 'angry', mouth: 'open', t });

        // Cascade of ultra hyper cold icy-blue water!
        if (wp > 0.02) {
          const sb = lerp(310, 775, wp), w = Math.sin(t * 20) * 8;
          out += `<g opacity="0.75">
            <path d="M 240 310 C ${(210 + w).toFixed(1)} 450, ${(360 - w).toFixed(1)} 560, 195 ${sb.toFixed(1)} L 405 ${sb.toFixed(1)} C ${(435 + w).toFixed(1)} 560, ${(330 - w).toFixed(1)} 450, 355 310 Z"
                  fill="#38BDF8" stroke="#0284C7" stroke-width="3.2"/>

        out += bucket({ x: 325, y: 258, rot: tip, fill: '#E2E8F0', rimFill: '#38BDF8', scale: 1.02 });
        out += prankster({ x: 468, y: pY, scale: 0.94, t });

        out += speechBubble({ cx: 112, cy: 505, rx: 88, ry: 78, tailX: 245, tailY: 520, lines: ['So', 'cold!!!'], fontSize: 34, scale: easeOutBack(invLerp(2.15, 2.6, t)), fill: '#E0F2FE', textColor: '#0369A1' });

        const lOp = invLerp(1.5, 1.9, t);
        if (lOp > 0.02) {
          out += `<g opacity="${lOp.toFixed(3)}">
            ${handArrow(445, 515, 365, 510, 405, 504, '#0284C7')}

      // ---------------------------------------------------------------------
      // SCENE 11: PANEL 11 — "Hahahahaha..." / "Hey! My shoes are wet!!!"
      // ---------------------------------------------------------------------
      case 11: {
        const lB = Math.sin(t * 22) * 5;
        out += `<g transform="translate(0 ${lB.toFixed(1)})" opacity="${invLerp(0.05, 0.42, t).toFixed(3)}">
          ${svgMultiText(300, 108, ['Hahahahahahahahaha', 'hahahahahahahahaha!!!'], { size: 32, lineHeight: 42, fill: '#7C3AED', rot: -1.5 })}
        </g>`;
        out += weirdGuy({ x: 282, y: 585, scale: 1.12, giantShoes: true, shoeScale: 1.24, shoesWet: true, shoeSoggy: 0.9, eyes: 'angry', mouth: 'open', t });
        out += speechBubble({ cx: 442, cy: 355, rx: 122, ry: 88, tailX: 332, tailY: 495, lines: ['Hey!', 'My shoes', 'are wet!!!'], fontSize: 28, scale: easeOutBack(invLerp(1.5, 1.95, t)), fill: '#E0F2FE' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 12: PANEL 12 — "My shoes are making an ocean!!!"
      // ---------------------------------------------------------------------
      case 12: {
        const tideY = lerp(740, 560, easeOutCubic(invLerp(0.15, 1.8, t)));
        out += weirdGuy({ x: 268, y: 575, scale: 1.12, giantShoes: true, shoeScale: 1.22, shoesWet: true, shoeSoggy: 1, eyes: 'angry', mouth: 'yell', t });
        out += oceanWaves({ levelY: tideY, t, opacity: 0.72 });
        out += speechBubble({ cx: 438, cy: 315, rx: 128, ry: 88, tailX: 318, tailY: 482, lines: ['My shoes', 'are making', 'an ocean!!!'], fontSize: 28, scale: easeOutBack(invLerp(1.15, 1.65, t)), fill: '#FEF9C3' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 13: PANEL 13 — Rising ocean! "Arggh!!!"
      // ---------------------------------------------------------------------
      case 13: {
        const tideY = lerp(520, 310, easeOutCubic(invLerp(0.1, 1.6, t)));
        out += weirdGuy({ x: 278, y: 560, scale: 1.1, giantShoes: true, shoeScale: 1.18, shoesWet: true, shoeSoggy: 1, arms: 'up', eyes: 'angry', mouth: 'yell', t });
        out += oceanWaves({ levelY: tideY, t, opacity: 0.65 });
        out += speechBubble({ cx: 438, cy: 235, rx: 108, ry: 66, tailX: 325, tailY: 445, lines: ['Arggh!!!'], fontSize: 38, scale: easeOutBack(invLerp(0.8, 1.25, t)), spiky: true, fill: '#FEE2E2', textColor: '#B91C1C' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 14: PANEL 14 — Completely underwater! "The whole world is an ocean!!!"
      // ---------------------------------------------------------------------
      case 14: {
        const tideY = lerp(220, 68, easeOutCubic(invLerp(0.1, 1.4, t)));
        out += oceanWaves({ levelY: tideY, t, opacity: 0.52 });
        // Rising bubbles
        const bY = (t * 60) % 120;
        out += `<g fill="#FFFFFF" fill-opacity="0.7" stroke="#0284C7" stroke-width="2">
          <circle cx="150" cy="${(360 - bY).toFixed(1)}" r="10"/>
          <circle cx="480" cy="${(520 - bY).toFixed(1)}" r="13"/>
          <circle cx="195" cy="${(620 - bY).toFixed(1)}" r="8"/>
        </g>`;
        out += weirdGuy({ x: 265, y: 575, scale: 1.12, giantShoes: true, shoeScale: 1.2, shoesWet: true, shoeSoggy: 1, arms: 'up', eyes: 'angry', mouth: 'yell', t });
        out += speechBubble({ cx: 448, cy: 295, rx: 126, ry: 92, tailX: 318, tailY: 472, lines: ['The whole', 'world is', 'an ocean!!!'], fontSize: 28, scale: easeOutBack(invLerp(1.05, 1.55, t)), fill: '#FFFFFF' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 15: PANEL 15 — Underwater "The End" + "Who will get me out of this ocean!!!"
      // ---------------------------------------------------------------------
      case 15: {
        const floatY = 540 + Math.sin(t * 3.5) * 14;
        out += oceanWaves({ levelY: 74, t, opacity: 0.56 });

        // Underwater "The End"
        const endS = easeOutBack(invLerp(0.7, 1.3, t));
        out += `<g transform="translate(300 285) scale(${endS.toFixed(3)})">
          ${svgText(0, 16, 'The End', { size: 88, fill: INK, stroke: '#E0F2FE', strokeWidth: 6 })}
          <path d="M -155 44 Q 0 32 155 44" fill="none" stroke="#0284C7" stroke-width="5.5" stroke-linecap="round"/>
        </g>`;

        // Floating sideways horizontally underwater in his giant shoes!
        out += weirdGuy({ x: 305, y: floatY, scale: 1.05, rot: 90, giantShoes: true, shoeScale: 1.12, shoesWet: true, shoeSoggy: 1, eyes: 'squint', mouth: 'open', t });

        // Rising underwater air bubbles
        const bY = (t * 45) % 90;
        out += `<g fill="#FFFFFF" fill-opacity="0.75" stroke="#0284C7" stroke-width="2">
          <circle cx="385" cy="${(465 - bY).toFixed(1)}" r="9"/>
          <circle cx="415" cy="${(420 - bY).toFixed(1)}" r="12"/>
        </g>`;

        out += speechBubble({
          cx: 412, cy: 712, rx: 152, ry: 74,
          tailX: 355, tailY: floatY + 42,
          lines: ['Who will get me', 'out of this ocean!!!'],
          fontSize: 24, scale: easeOutBack(invLerp(1.85, 2.35, t)), fill: '#FFFFFF'
        });

        out += svgText(300, 810, 'The Weird Guy #4  •  By superbear1859', {
          size: 19, fill: '#1E293B', opacity: invLerp(2.7, 3.3, t) * 0.85
        });
        break;
      }
    }

    return wrapPanel(out, { panelNum: s.panelNum, shakeX, shakeY });
  }

  function timeToScene(globalT) {
    const t = clamp(globalT, 0, TOTAL_DURATION);
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].end || i === SCENES.length - 1) return { sceneIdx: i, localT: t - SCENES[i].start };
    }
    return { sceneIdx: 0, localT: 0 };
  }

  // =========================================================================
  // REAL-TIME WEB AUDIO CARTOON SFX & CHATTER SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.16, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playSweep(f0, f1, dur, type = 'triangle', vol = 0.18, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f0), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, vol = 0.16, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = filterType; flt.frequency.setValueAtTime(filterFreq, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  function triggerCue(cue) {
    if (muted || !audioCtx) return;
    const tp = cue.type;
    if (tp === 'intro_jingle') {
      [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.18, i * 0.10));
    } else if (tp === 'outro_jingle') {
      [[523, 0.16, 0], [494, 0.16, 0.15], [466, 0.16, 0.30], [440, 0.42, 0.45]].forEach(([f, d, dl]) => playTone(f, d, 'triangle', 0.18, dl));
    } else if (tp === 'weird_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 540;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 150 - 55), 0.065, 'square', 0.08, i * 0.085);
    } else if (tp === 'narrator_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 205;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 45 - 20), 0.10, 'sawtooth', 0.10, i * 0.115);
    } else if (tp === 'weird_yell') {
      const b = cue.pitch || 660;
      playSweep(b * 0.85, b * 1.25, 0.26, 'square', 0.12);
    } else if (tp === 'shiver_talk') {
      for (let i = 0; i < 8; i++) playTone(560 + (i % 2 ? 90 : -70), 0.045, 'triangle', 0.12, i * 0.06);
    } else if (tp === 'thud') {
      playSweep(150, 40, 0.24, 'sine', 0.28);
      playNoise(0.15, 0.20, 280, 'lowpass');
    } else if (tp === 'slip_whistle') {
      playSweep(360, 1150, 0.38, 'sine', 0.20);
    } else if (tp === 'fall_whistle') {
      playSweep(1050, 220, 0.55, 'sine', 0.18);
    } else if (tp === 'lava_sizzle') {
      playNoise(0.95, 0.22, 2400, 'highpass');
      for (let i = 0; i < 6; i++) playSweep(160 + i * 24, 310 + i * 32, 0.09, 'sine', 0.10, i * 0.11);
    } else if (tp === 'fire_roar') {
      playNoise(0.95, 0.22, 650, 'bandpass');
      playNoise(0.90, 0.15, 2200, 'highpass', 0.08);
    } else if (tp === 'sneeze_achoo') {
      playSweep(380, 620, 0.16, 'triangle', 0.14);
      playNoise(0.32, 0.26, 1800, 'bandpass', 0.18);
      playSweep(760, 220, 0.22, 'sawtooth', 0.16, 0.18);
    } else if (tp === 'poop_horn') {
      playSweep(190, 95, 0.42, 'sawtooth', 0.22);
      playSweep(140, 68, 0.38, 'square', 0.11, 0.04);
    } else if (tp === 'spit_bleh') {
      playSweep(420, 160, 0.22, 'sawtooth', 0.16);
      playNoise(0.20, 0.18, 1200, 'bandpass');
    } else if (tp === 'barf_blek') {
      playSweep(280, 95, 0.48, 'sawtooth', 0.20);
      playNoise(0.45, 0.20, 750, 'bandpass');
    } else if (tp === 'water_splash') {
      playNoise(0.75, 0.22, 1400, 'bandpass');
      for (let i = 0; i < 6; i++) playSweep(420 + i * 60, 980 + i * 70, 0.07, 'sine', 0.09, i * 0.07);
    } else if (tp === 'ocean_wave') {
      playNoise(0.95, 0.20, 520, 'lowpass');
      for (let i = 0; i < 4; i++) playSweep(300 + i * 90, 620 + i * 90, 0.08, 'sine', 0.09, i * 0.12);
    } else if (tp === 'underwater_bubbles') {
      for (let i = 0; i < 6; i++) playSweep(280 + i * 70, 720 + i * 85, 0.09, 'sine', 0.13, i * 0.11);
    } else if (tp === 'giggle') {
      [720, 860, 780, 960].forEach((f, i) => playTone(f, 0.075, 'triangle', 0.13, i * 0.08));
    } else if (tp === 'evil_laugh') {
      [310, 290, 275, 320, 285, 260, 240, 220].forEach((f, i) => playTone(f, 0.085, 'sawtooth', 0.12, i * 0.105));
    } else if (tp === 'rage_arggh') {
      playSweep(460, 720, 0.45, 'sawtooth', 0.15);
    } else if (tp === 'ding') {
      playTone(1046.5, 0.35, 'sine', 0.16);
      playTone(1568, 0.32, 'sine', 0.11, 0.06);
    } else if (tp === 'squeak_ow') {
      playSweep(760, 1180, 0.18, 'triangle', 0.18);
    }
  }

  // =========================================================================
  // PLAYER STATE & UI
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const sceneBadge = document.getElementById('sceneBadge');
  const timeReadout = document.getElementById('timeReadout');
  const scrubber = document.getElementById('scrubber');
  const playOverlay = document.getElementById('playOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnMute = document.getElementById('btnMute');
  const speedSelect = document.getElementById('speedSelect');
  const sceneGrid = document.getElementById('sceneGrid');

  let currentTime = 0, playing = false, speed = 1.0, lastFrameTs = null;
  let firedCues = new Set(), activeSceneIdx = -1, hasInteracted = false;

  SCENES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-pill';
    btn.dataset.idx = i;
    btn.textContent = s.panelNum === null ? 'Cover' : `${s.panelNum}. ${s.title}`;
    btn.title = s.panelNum === null ? 'Cover' : `Panel ${s.panelNum}: ${s.title}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      seekTo(s.start + 0.01);
      setPlaying(true);
    });
    sceneGrid.appendChild(btn);
  });

  const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function updateUI() {
    const { sceneIdx, localT } = timeToScene(currentTime);
    const s = SCENES[sceneIdx];
    stageEl.innerHTML = renderScene(sceneIdx, localT);
    sceneBadge.textContent = `${s.panelNum === null ? 'Cover' : 'Panel ' + s.panelNum} • ${sceneIdx + 1} / ${SCENES.length}`;
    timeReadout.textContent = `${fmtTime(currentTime)} / ${fmtTime(TOTAL_DURATION)}`;
    scrubber.value = Math.round((currentTime / TOTAL_DURATION) * 1000);
    if (sceneIdx !== activeSceneIdx) {
      activeSceneIdx = sceneIdx;
      for (const el of sceneGrid.children) {
        const isCur = Number(el.dataset.idx) === sceneIdx;
        el.className = isCur ? 'scene-pill active' : 'scene-pill';
      }
      if (hasInteracted && window.WeirdGuyProgress) {
        window.WeirdGuyProgress.save('04', sceneIdx, SCENES.length, currentTime >= TOTAL_DURATION - 0.1);
      }
    }
  }

  function seekTo(t) {
    hasInteracted = true;
    currentTime = clamp(t, 0, TOTAL_DURATION);
    firedCues = new Set();
    for (const c of AUDIO_CUES) if (c.globalT < currentTime - 0.05) firedCues.add(c.id);
    updateUI();
  }

  function setPlaying(val) {
    playing = val;
    playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    playLabel.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      hasInteracted = true;
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      if (currentTime >= TOTAL_DURATION - 0.05) seekTo(0);
      lastFrameTs = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.08, (now - lastFrameTs) / 1000) * speed;
    lastFrameTs = now;
    currentTime = Math.min(TOTAL_DURATION, currentTime + dt);
    for (const c of AUDIO_CUES) {
      if (!firedCues.has(c.id) && c.globalT <= currentTime) {
        firedCues.add(c.id);
        triggerCue(c);
      }
    }
    updateUI();
    if (currentTime >= TOTAL_DURATION) {
      if (window.WeirdGuyProgress) window.WeirdGuyProgress.save('04', SCENES.length - 1, SCENES.length, true);
      setPlaying(false);
    }
    else requestAnimationFrame(tick);
  }

  btnPlay.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('stageContainer').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('overlayPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); setPlaying(true); });
  btnRestart.addEventListener('click', () => { seekTo(0); setPlaying(true); });
  btnPrev.addEventListener('click', () => seekTo(SCENES[Math.max(0, activeSceneIdx - 1)].start + 0.01));
  btnNext.addEventListener('click', () => seekTo(SCENES[Math.min(SCENES.length - 1, activeSceneIdx + 1)].start + 0.01));
  scrubber.addEventListener('input', () => seekTo((Number(scrubber.value) / 1000) * TOTAL_DURATION));
  speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value) || 1; });
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.innerHTML = muted ? '&#128263; Muted' : '&#128266; Sound On';
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'm' || e.key === 'M') { btnMute.click(); }
  });

  // Expose volume hook for assets/print.js (Fold & Staple Booklet + 32/48-card Thumb-Flipbook)
  window.WeirdGuyVolume = {
    id: '04',
    number: 4,
    title: "Don't Try New Things",
    edition: 'Big, Blank Edition!',
    author: 'superbear1859',
    scenes: SCENES,
    renderScene: renderScene
  };

  // Render full cover showcase frame initially (or jump to saved #scene=N)
  const initialScene = window.WeirdGuyProgress ? window.WeirdGuyProgress.getInitialSceneFromHash(SCENES.length) : null;
  if (initialScene !== null && initialScene > 0) {
    currentTime = SCENES[initialScene].start + 0.01;
    updateUI();
  } else {
    currentTime = 3.2;
    updateUI();
    currentTime = 0;
    scrubber.value = 0;
    timeReadout.textContent = `0:00 / ${fmtTime(TOTAL_DURATION)}`;
  }
})();
</script>
