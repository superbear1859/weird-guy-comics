        // Flying smugly with jetpack!
        out += weirdGuy({ x: gX, y: gY, scale: 1.12, rot: 90, eyes: 'normal', mouth: 'smug', arms: 'flying', legs: 'flying', jetpack: true, jetFlame: true, t });

        out += thoughtBubble({ cx: 430, cy: 295, rx: 108, ry: 60, dotStartX: gX + 35, dotStartY: 415, lines: ['Heh heh!'], fontSize: 30, scale: easeOutBack(invLerp(1.2, 1.65, t)) });
        out += speechBubble({ cx: 435, cy: 650, rx: 88, ry: 60, tailX: gX + 42, tailY: 520, lines: ['poop!!!'], fontSize: 34, scale: easeOutBack(invLerp(2.0, 2.45, t)), fill: '#FEF9C3', textColor: '#92400E' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 10: PANEL 10 — "Why are you not clonking!!???" / "Jetpack!!!"
      // ---------------------------------------------------------------------
      case 10: {
        const gX = lerp(110, 325, easeOutCubic(invLerp(0.25, 2.2, t)));
        const gY = 535 + Math.sin(t * 12) * 8;
        out += svgMultiText(300, 128, ['Why are you not', 'clonking!!???'], { size: 50, lineHeight: 62, fill: '#1D4ED8', opacity: invLerp(0.08, 0.48, t) });

        out += weirdGuy({ x: gX, y: gY, scale: 1.16, rot: 85, eyes: 'normal', mouth: 'open', arms: 'flying', legs: 'flying', jetpack: true, jetFlame: true, t });
        out += speechBubble({ cx: 422, cy: 335, rx: 112, ry: 64, tailX: gX + 42, tailY: 472, lines: ['Jetpack!!!'], fontSize: 34, scale: easeOutBack(invLerp(1.55, 2.05, t)), fill: '#E0F2FE' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 11: PANEL 11 — Prankster pours LAVA on jetpack! "Hey!!!!!!"
      // ---------------------------------------------------------------------
      case 11: {
        const pY = lerp(-70, 145, easeOutBack(invLerp(0.05, 0.55, t)));
        const tip = lerp(45, 152, easeInOutCubic(invLerp(0.45, 0.95, t)));
        const lp = invLerp(0.7, 1.5, t), ch = invLerp(1.15, 2.0, t);

        // Weird Guy flying right below the lava stream!
        out += weirdGuy({ x: 318, y: 635, scale: 1.12, rot: 90, eyes: 'squint', mouth: 'yell', arms: 'flying', legs: 'flying', jetpack: true, jetFlame: ch < 0.6, jetCharred: ch, t });

        // Molten Lava stream pouring right onto his jetpack!
        if (lp > 0.02) {
          const sb = lerp(290, 588, lp), w = Math.sin(t * 18) * 7;
          out += `<g>
            <path d="M 272 288 C ${(246 + w).toFixed(1)} 380, ${(330 - w).toFixed(1)} 470, 260 ${sb.toFixed(1)} L 325 ${sb.toFixed(1)} C ${(348 + w).toFixed(1)} 470, ${(298 - w).toFixed(1)} 380, 312 288 Z"
                  fill="#F97316" stroke="#DC2626" stroke-width="3.6"/>
            <path d="M 288 300 C ${(274 + w * 0.6).toFixed(1)} 390, ${(310 - w * 0.6).toFixed(1)} 470, 290 ${Math.min(sb - 12, 570).toFixed(1)}"
                  fill="none" stroke="#FDE047" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
          </g>`;
        }

        out += bucket({ x: 298, y: 235, rot: tip, fill: '#CBD5E1', rimFill: '#F97316', scale: 0.95 });
        out += stickFriend({ x: 208, y: pY, scale: 0.96, t });

        const lOp = invLerp(0.95, 1.3, t);
        if (lOp > 0.02) {
          out += `<g opacity="${lOp.toFixed(3)}">
            ${handArrow(415, 420, 326, 412, 370, 405, '#DC2626')}
            ${svgText(472, 434, 'Lava', { size: 36, fill: '#DC2626', rot: -4 })}
          </g>`;
        }

        out += speechBubble({ cx: 462, cy: 762, rx: 102, ry: 48, tailX: 378, tailY: 678, lines: ['Hey!!!!!!'], fontSize: 32, scale: easeOutBack(invLerp(1.9, 2.35, t)), spiky: true, fill: '#FEF2F2', textColor: '#DC2626' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 12: PANEL 12 — MASSIVE "Boom!!!" + "Arggh!!!"
      // ---------------------------------------------------------------------
      case 12: {
        if (t >= 0.16 && t < 0.95) {
          const d = 1 - invLerp(0.16, 0.95, t);
          shakeX = Math.sin(t * 105) * 18 * d; shakeY = Math.cos(t * 95) * 15 * d;
        }
        const boomS = easeOutElastic(invLerp(0.12, 0.72, t));
        const guyX = lerp(380, 462, easeOutCubic(invLerp(0.2, 0.85, t)));

        // Huge spiky cartoon explosion star on the left!
        if (boomS > 0.02) {
          out += `<g transform="translate(222 495) scale(${boomS.toFixed(3)})">
            <polygon points="-20,-195 36,-98 158,-168 106,-46 218,8 102,54 148,176 26,104 -32,202 -66,92 -184,126 -116,18 -196,-58 -92,-76 -134,-182"
                     fill="#FEF08A" stroke="#DC2626" stroke-width="5" stroke-linejoin="round"/>
            <polygon points="-10,-128 24,-64 104,-110 70,-30 144,6 68,36 98,116 18,68 -20,132 -44,60 -120,82 -76,12 -128,-38 -60,-50 -88,-120"
                     fill="#FB923C" opacity="0.65"/>
            ${svgText(0, 18, 'Boom!!!', { size: 64, fill: '#B91C1C', stroke: '#FFF', strokeWidth: 7, rot: -8 })}
          </g>`;
        }

        // Weird Guy blasted right with sparks/flames catching his back!
        out += weirdGuy({ x: guyX, y: 655, scale: 1.08, eyes: 'angry', mouth: 'yell', arms: 'up', t });
        out += speechBubble({ cx: 472, cy: 365, rx: 102, ry: 72, tailX: guyX, tailY: 538, lines: ['Arggh!!!'], fontSize: 34, scale: easeOutBack(invLerp(1.1, 1.55, t)), spiky: true, fill: '#FEE2E2', textColor: '#B91C1C' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 13: PANEL 13 — "Your butt is on fire!!!" + GIANT FLAMING BUTT! + "Ahhhh!!"
      // ---------------------------------------------------------------------
      case 13: {
        const gSh = t > 0.5 ? Math.sin(t * 48) * 4 : 0;
        out += svgMultiText(265, 118, ['Your butt is', 'on fire!!!'], { size: 50, lineHeight: 58, fill: '#DC2626', opacity: invLerp(0.08, 0.48, t) });

        // Weird Guy with huge flaming cartoon butt!
        out += weirdGuy({ x: 378 + gSh, y: 582, scale: 1.25, eyes: 'angry', mouth: 'yell', arms: 'out', bigButtFire: true, buttFireT: t, t });

        out += speechBubble({ cx: 455, cy: 295, rx: 108, ry: 66, tailX: 392, tailY: 445, lines: ['Ahhhh!!'], fontSize: 36, scale: easeOutBack(invLerp(1.3, 1.75, t)), spiky: true, fill: '#FEF9C3', textColor: '#B91C1C' });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 14: PANEL 14 — "Hahahaha hahaha!!!" + smoking pile of ash + "Hey, where is my butt??!!!!"
      // ---------------------------------------------------------------------
      case 14: {
        const lB = Math.sin(t * 22) * 5;
        out += `<g transform="translate(0 ${lB.toFixed(1)})" opacity="${invLerp(0.05, 0.42, t).toFixed(3)}">
          ${svgText(300, 118, 'Hahahaha hahaha!!!', { size: 50, fill: '#7C3AED', rot: -2 })}
        </g>`;

        // Smoking gray ash pile floating right behind him!
        const ashOp = invLerp(0.45, 0.95, t);
        const w = Math.sin(t * 10) * 5;
        out += `<g opacity="${ashOp.toFixed(3)}">
          <path d="M 192 595 C 165 568, 178 518, 212 516 C 242 502, 272 528, 262 565 C 272 595, 224 614, 192 595 Z"
                fill="#94A3B8" stroke="#475569" stroke-width="3" opacity="0.82"/>
          <path d="M 205 508 Q ${(196 + w).toFixed(1)} 478 208 452 M 235 502 Q ${(246 - w).toFixed(1)} 472 232 446"
                fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
          ${handArrow(218, 695, 220, 612, 212, 654, '#475569')}
          ${svgText(218, 738, 'ash', { size: 36, fill: '#475569' })}
        </g>`;

        out += weirdGuy({ x: 302, y: 562, scale: 1.16, eyes: 'angry', mouth: 'open', arms: 'out', t });

        out += speechBubble({
          cx: 452, cy: 328, rx: 126, ry: 88,
          tailX: 355, tailY: 455,
          lines: ['Hey, where', 'is my', 'butt??!!!!'],
          fontSize: 28, scale: easeOutBack(invLerp(1.4, 1.9, t)), fill: '#FEF9C3'
        });
        break;
      }

      // ---------------------------------------------------------------------
      // SCENE 15: PANEL 15 — "It burned to ashes!!!" + "The End" + "I can't poop!!!"
      // ---------------------------------------------------------------------
      case 15: {
        out += svgMultiText(285, 118, ['It burned to', 'ashes!!!'], { size: 48, lineHeight: 56, fill: '#475569', opacity: invLerp(0.08, 0.5, t) });

        const endS = easeOutBack(invLerp(1.05, 1.6, t));
        out += `<g transform="translate(300 340) scale(${endS.toFixed(3)})">
          ${svgText(0, 16, 'The End', { size: 88, fill: INK })}
          <path d="M -155 42 Q 0 30 155 42" fill="none" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round"/>
        </g>`;

        out += `<ellipse cx="235" cy="738" rx="50" ry="11" fill="#CBD5E1" opacity="0.6"/>`;
        out += weirdGuy({ x: 235, y: 632, scale: 1.08, eyes: 'angry', mouth: 'yell', arms: 'out', t, opacity: invLerp(1.7, 2.05, t) });

        out += speechBubble({
          cx: 432, cy: 558, rx: 112, ry: 68,
          tailX: 292, tailY: 595,
          lines: ["I can't", 'poop!!!'],
          fontSize: 34, scale: easeOutBack(invLerp(2.2, 2.65, t)), fill: '#FEE2E2', textColor: '#B91C1C'
        });

        out += svgText(300, 798, 'The Weird Guy #3  •  By superbear1859', {
          size: 19, fill: '#64748B', opacity: invLerp(2.9, 3.5, t) * 0.85
        });
        break;
      }
    }

    return wrapPanel(out, {
      panelNum: s.panelNum,
      shakeX,
      shakeY,
      binderHole: [4, 5, 6, 7, 12, 13, 14, 15].includes(sceneIdx)
    });
  }

  function timeToScene(globalT) {
    const t = clamp(globalT, 0, TOTAL_DURATION);
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].end || i === SCENES.length - 1) return { sceneIdx: i, localT: t - SCENES[i].start };
    }
    return { sceneIdx: 0, localT: 0 };
  }

  // =========================================================================
  // REAL-TIME WEB AUDIO CARTOON SFX & CHATTER SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.16, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playSweep(f0, f1, dur, type = 'triangle', vol = 0.18, delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, f0), now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, vol = 0.16, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = filterType; flt.frequency.setValueAtTime(filterFreq, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  function triggerCue(cue) {
    if (muted || !audioCtx) return;
    const tp = cue.type;
    if (tp === 'intro_jingle') {
      [392, 494, 587, 784].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.18, i * 0.10));
    } else if (tp === 'outro_jingle') {
      [[523, 0.16, 0], [494, 0.16, 0.15], [466, 0.16, 0.30], [440, 0.42, 0.45]].forEach(([f, d, dl]) => playTone(f, d, 'triangle', 0.18, dl));
    } else if (tp === 'weird_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 540;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 150 - 55), 0.065, 'square', 0.08, i * 0.085);
    } else if (tp === 'narrator_talk') {
      const cnt = cue.count || 5, base = cue.pitch || 205;
      for (let i = 0; i < cnt; i++) playTone(base + (Math.random() * 45 - 20), 0.10, 'sawtooth', 0.10, i * 0.115);
    } else if (tp === 'weird_yell') {
      const b = cue.pitch || 660;
      playSweep(b * 0.85, b * 1.25, 0.26, 'square', 0.12);
    } else if (tp === 'ping') {
      playTone(cue.pitch || 680, 0.11, 'triangle', 0.14);
    } else if (tp === 'mega_boom') {
      playSweep(155, 42, 0.55, 'sawtooth', 0.24);
      playNoise(0.38, 0.22, 260, 'lowpass');
    } else if (tp === 'explosion_boom') {
      playSweep(180, 28, 0.72, 'sawtooth', 0.32);
      playNoise(0.65, 0.34, 340, 'lowpass');
    } else if (tp === 'zoing') {
      playSweep(230, 980, 0.24, 'triangle', 0.22, 0);
      playSweep(980, 410, 0.34, 'sine', 0.18, 0.22);
    } else if (tp === 'jetpack_whoosh') {
      playNoise(0.85, 0.22, 950, 'bandpass');
      playSweep(180, 420, 0.55, 'triangle', 0.12);
    } else if (tp === 'fire_roar') {
      playNoise(1.0, 0.24, 650, 'bandpass');
      playNoise(0.95, 0.16, 2200, 'highpass', 0.08);
    } else if (tp === 'thud') {
      playSweep(160, 44, 0.22, 'sine', 0.26);
      playNoise(0.14, 0.18, 300, 'lowpass');
    } else if (tp === 'clonk') {
      playSweep(280, 62, 0.25, 'triangle', 0.28);
      playTone(620, 0.12, 'square', 0.11);
      playNoise(0.16, 0.20, 500, 'lowpass');
    } else if (tp === 'grumble') {
      playSweep(130, 90, 0.48, 'sawtooth', 0.16);
    } else if (tp === 'giggle') {
      [720, 860, 780, 960].forEach((f, i) => playTone(f, 0.075, 'triangle', 0.13, i * 0.08));
    } else if (tp === 'evil_laugh') {
      [310, 290, 275, 320, 285, 260, 240, 220].forEach((f, i) => playTone(f, 0.085, 'sawtooth', 0.12, i * 0.105));
    } else if (tp === 'robot_boot') {
      [330, 440, 660, 880].forEach((f, i) => playTone(f, 0.10, 'square', 0.09, i * 0.085));
    } else if (tp === 'lava_sizzle') {
      playNoise(0.95, 0.22, 2400, 'highpass');
      for (let i = 0; i < 6; i++) playSweep(160 + i * 24, 310 + i * 32, 0.09, 'sine', 0.10, i * 0.11);
    } else if (tp === 'rage_arggh') {
      playSweep(460, 720, 0.45, 'sawtooth', 0.15);
    } else if (tp === 'poop_horn') {
      playSweep(190, 95, 0.40, 'sawtooth', 0.20);
      playSweep(140, 68, 0.36, 'square', 0.11, 0.04);
    } else if (tp === 'ding') {
      playTone(1046.5, 0.35, 'sine', 0.16);
      playTone(1568, 0.32, 'sine', 0.11, 0.06);
    } else if (tp === 'thought_ding') {
      playTone(880, 0.22, 'sine', 0.13);
      playTone(1318.5, 0.32, 'sine', 0.13, 0.10);
    }
  }

  // =========================================================================
  // PLAYER STATE & UI
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const sceneBadge = document.getElementById('sceneBadge');
  const timeReadout = document.getElementById('timeReadout');
  const scrubber = document.getElementById('scrubber');
  const playOverlay = document.getElementById('playOverlay');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnMute = document.getElementById('btnMute');
  const speedSelect = document.getElementById('speedSelect');
  const sceneGrid = document.getElementById('sceneGrid');

  let currentTime = 0, playing = false, speed = 1.0, lastFrameTs = null;
  let firedCues = new Set(), activeSceneIdx = -1, hasInteracted = false;

  SCENES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-pill';
    btn.dataset.idx = i;
    btn.textContent = s.panelNum === null ? 'Cover' : `${s.panelNum}. ${s.title}`;
    btn.title = s.panelNum === null ? 'Cover' : `Panel ${s.panelNum}: ${s.title}`;
    btn.addEventListener('click', () => {
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      seekTo(s.start + 0.01);
      setPlaying(true);
    });
    sceneGrid.appendChild(btn);
  });

  const fmtTime = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;

  function updateUI() {
    const { sceneIdx, localT } = timeToScene(currentTime);
    const s = SCENES[sceneIdx];
    stageEl.innerHTML = renderScene(sceneIdx, localT);
    sceneBadge.textContent = `${s.panelNum === null ? 'Cover' : 'Panel ' + s.panelNum} • ${sceneIdx + 1} / ${SCENES.length}`;
    timeReadout.textContent = `${fmtTime(currentTime)} / ${fmtTime(TOTAL_DURATION)}`;
    scrubber.value = Math.round((currentTime / TOTAL_DURATION) * 1000);
    if (sceneIdx !== activeSceneIdx) {
      activeSceneIdx = sceneIdx;
      for (const el of sceneGrid.children) {
        const isCur = Number(el.dataset.idx) === sceneIdx;
        el.className = isCur ? 'scene-pill active' : 'scene-pill';
      }
      if (hasInteracted && window.WeirdGuyProgress) {
        window.WeirdGuyProgress.save('03', sceneIdx, SCENES.length, currentTime >= TOTAL_DURATION - 0.1);
      }
    }
  }

  function seekTo(t) {
    hasInteracted = true;
    currentTime = clamp(t, 0, TOTAL_DURATION);
    firedCues = new Set();
    for (const c of AUDIO_CUES) if (c.globalT < currentTime - 0.05) firedCues.add(c.id);
    updateUI();
  }

  function setPlaying(val) {
    playing = val;
    playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    playLabel.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      hasInteracted = true;
      ensureAudio();
      playOverlay.style.opacity = '0';
      playOverlay.style.pointerEvents = 'none';
      if (currentTime >= TOTAL_DURATION - 0.05) seekTo(0);
      lastFrameTs = performance.now();
      requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.08, (now - lastFrameTs) / 1000) * speed;
    lastFrameTs = now;
    currentTime = Math.min(TOTAL_DURATION, currentTime + dt);
    for (const c of AUDIO_CUES) {
      if (!firedCues.has(c.id) && c.globalT <= currentTime) {
        firedCues.add(c.id);
        triggerCue(c);
      }
    }
    updateUI();
    if (currentTime >= TOTAL_DURATION) {
      if (window.WeirdGuyProgress) window.WeirdGuyProgress.save('03', SCENES.length - 1, SCENES.length, true);
      setPlaying(false);
    }
    else requestAnimationFrame(tick);
  }

  btnPlay.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('stageContainer').addEventListener('click', () => setPlaying(!playing));
  document.getElementById('overlayPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); setPlaying(true); });
  btnRestart.addEventListener('click', () => { seekTo(0); setPlaying(true); });
  btnPrev.addEventListener('click', () => seekTo(SCENES[Math.max(0, activeSceneIdx - 1)].start + 0.01));
  btnNext.addEventListener('click', () => seekTo(SCENES[Math.min(SCENES.length - 1, activeSceneIdx + 1)].start + 0.01));
  scrubber.addEventListener('input', () => seekTo((Number(scrubber.value) / 1000) * TOTAL_DURATION));
  speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value) || 1; });
  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.innerHTML = muted ? '&#128263; Muted' : '&#128266; Sound On';
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'm' || e.key === 'M') { btnMute.click(); }
  });

  // Expose volume hook for print.js compatibility
  window.WeirdGuyVolume = {
    id: '03',
    number: 3,
    title: "It's a Bird, No, It's a Plane, No, It's the Weird Guy!",
    edition: 'Notebook Edition',
    author: 'superbear1859',
    scenes: SCENES,
    renderScene: renderScene
  };

  // Render full cover showcase frame initially (or jump to saved #scene=N)
  const initialScene = window.WeirdGuyProgress ? window.WeirdGuyProgress.getInitialSceneFromHash(SCENES.length) : null;
  if (initialScene !== null && initialScene > 0) {
    currentTime = SCENES[initialScene].start + 0.01;
    updateUI();
  } else {
    currentTime = 3.2;
    updateUI();
    currentTime = 0;
    scrubber.value = 0;
    timeReadout.textContent = `0:00 / ${fmtTime(TOTAL_DURATION)}`;
  }
})();
